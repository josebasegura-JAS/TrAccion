<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Cargando TrAcción</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f1f2a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 18%, rgba(214, 35, 53, 0.2), transparent 31%),
          linear-gradient(145deg, #132836 0%, #0d1a24 56%, #081119 100%);
        color: #f7fbfd;
        user-select: none;
      }
      .splash-card {
        width: 438px;
        padding: 24px 28px 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        background: rgba(12, 24, 34, 0.9);
        box-shadow: 0 28px 65px rgba(0, 0, 0, 0.34);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 20px;
      }
      .logo {
        width: 92px;
        height: 92px;
        flex: 0 0 92px;
        object-fit: contain;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.32));
      }
      .title {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 4px 0 0;
        color: rgba(247, 251, 253, 0.67);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .status-title {
        margin: 0 0 10px;
        font-size: 13px;
        color: rgba(247, 251, 253, 0.72);
      }
      .steps { display: grid; gap: 7px; }
      .step {
        min-height: 38px;
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid rgba(255,255,255,.06);
        border-radius: 10px;
        background: rgba(255,255,255,.025);
        transition: background .2s ease, border-color .2s ease, opacity .2s ease;
      }
      .step.active {
        background: rgba(214,35,53,.10);
        border-color: rgba(214,35,53,.26);
      }
      .step.done {
        background: rgba(85,217,138,.055);
        border-color: rgba(85,217,138,.12);
      }
      .step.error {
        background: rgba(255,77,79,.09);
        border-color: rgba(255,77,79,.25);
      }
      .icon {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 800;
      }
      .step.pending .icon { color: rgba(255,255,255,.25); }
      .step.done .icon { color: #55d98a; }
      .step.error .icon { color: #ff6b72; }
      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255,255,255,.22);
        border-top-color: #f04452;
        border-radius: 50%;
        animation: spin .72s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .label {
        font-size: 12.5px;
        line-height: 1.2;
        color: rgba(247,251,253,.9);
      }
      .detail {
        grid-column: 2 / 4;
        margin-top: -3px;
        font-size: 10.5px;
        line-height: 1.25;
        color: rgba(247,251,253,.54);
        word-break: break-word;
      }
      .elapsed {
        font-size: 10px;
        color: rgba(247,251,253,.46);
        font-variant-numeric: tabular-nums;
      }
      .footer {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .progress {
        flex: 1;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,.10);
      }
      .progress-bar {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #8f1724, #d62335, #ff6c78);
        transition: width .28s ease;
      }
      .progress-text {
        min-width: 28px;
        text-align: right;
        font-size: 10px;
        color: rgba(247,251,253,.52);
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
        .progress-bar { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="splash-card" aria-label="TrAcción se está iniciando" aria-busy="true">
      <section class="brand">
        <img class="logo" src="./traccion-logo.png" alt="TrAcción" />
        <div>
          <h1 class="title">TrAcción</h1>
          <p class="subtitle">Relaciones Laborales</p>
        </div>
      </section>

      <p class="status-title">Preparando entorno de trabajo</p>
      <section class="steps" id="steps" aria-live="polite">
        <div class="step active" data-step="electron" data-status="active"><span class="icon"><span class="spinner"></span></span><span class="label">Preparando aplicación</span><span class="elapsed"></span></div>
        <div class="step pending" data-step="persistence" data-status="pending"><span class="icon">•</span><span class="label">Cargando motor de datos</span><span class="elapsed"></span></div>
        <div class="step pending" data-step="database" data-status="pending"><span class="icon">•</span><span class="label">Conectando y verificando base de datos</span><span class="elapsed"></span></div>
        <div class="step pending" data-step="services" data-status="pending"><span class="icon">•</span><span class="label">Preparando servicios internos</span><span class="elapsed"></span></div>
        <div class="step pending" data-step="interface" data-status="pending"><span class="icon">•</span><span class="label">Cargando datos e interfaz</span><span class="elapsed"></span></div>
      </section>
      <div class="footer">
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <span class="progress-text" id="progressText">0%</span>
      </div>
    </main>

    <script src="./splash.js"></script>
  </body>
</html>
