<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Cargando TrAcción</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: #07131d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at top, rgba(220, 38, 38, 0.18), transparent 34%),
          linear-gradient(135deg, #07131d 0%, #102532 52%, #07131d 100%);
        color: #f8fafc;
        user-select: none;
      }
      .app-boot-card {
        width: min(460px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 34px 36px 30px;
        border: 1px solid rgba(226, 232, 240, 0.14);
        border-radius: 28px;
        background: rgba(15, 31, 42, 0.88);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
        text-align: center;
      }
      .logo {
        width: 168px;
        max-width: 72%;
        height: auto;
        margin-bottom: 6px;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.35));
      }
      .title {
        margin: 0;
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 0;
        color: rgba(226, 232, 240, 0.78);
        font-size: 0.95rem;
        font-weight: 600;
      }
      .loader {
        width: 190px;
        height: 4px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.28);
      }
      .loader::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #dc2626;
        animation: appBootLoader 1.08s ease-in-out infinite;
      }
      .message {
        min-height: 20px;
        margin: 4px 0 0;
        color: rgba(248, 250, 252, 0.86);
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.35;
      }
      .message.error { color: #fecaca; }
      @keyframes appBootLoader {
        0% { transform: translateX(-120%); }
        50% { transform: translateX(70%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader::after { animation: none; transform: translateX(70%); }
      }
    </style>
  </head>
  <body>
    <main class="app-boot-card" aria-label="TrAcción se está iniciando" aria-busy="true">
      <img class="logo" src="./traccion-splash.png" alt="TrAcción" />
      <h1 class="title">TrAcción</h1>
      <p class="subtitle">Relaciones Laborales</p>
      <div class="loader" aria-hidden="true"></div>
      <p class="message" id="bootMessage" aria-live="polite">Iniciando TrAcción…</p>
    </main>
    <script src="./splash.js"></script>
  </body>
</html>
