<!doctype html><html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Claudia Matematika</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#1d1d1f}.w{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 16px 24px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px}.brand{font-weight:800;font-size:22px}.score{color:#666;font-weight:700}.bar{height:8px;background:#ddd;border-radius:99px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:#d32f2f;width:0}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 25px #00000012}.tag{display:inline-block;background:#eee;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}h1{font-size:27px;line-height:1.2}.help{color:#666;margin-bottom:16px}.roman{background:#f2f2f2;padding:12px;border-radius:14px;font-weight:700;margin:12px 0}.answers{display:grid;gap:10px}.a,.main,input{width:100%;min-height:54px;border-radius:15px;font-size:18px}.a{background:#fff;border:1px solid #ddd;font-weight:750}.main{border:0;background:#d32f2f;color:#fff;font-weight:800;margin-top:12px}input{box-sizing:border-box;border:1px solid #ccc;padding:12px 14px}.ok{color:#26803b}.bad{color:#c62828}.fb{font-weight:800;min-height:26px;margin-top:14px}.end{text-align:center}.big{font-size:55px}</style></head><body><div class="w"><div class="top"><div class="brand">Claudia · Matematika</div><div class="score" id="s">0 puntu</div></div><div class="bar"><i id="b"></i></div><div class="card"><div id="q"></div></div></div><script>
const R=(a)=>a[Math.floor(Math.random()*a.length)], shuffle=a=>a.sort(()=>Math.random()-.5);
function roundQ(){
 const kind=R(["10","100","1000"]);
 if(kind==="10"){let n=Math.floor(Math.random()*90)+10;let c=Math.round(n/10)*10;return {cat:"Biribilketa",q:n+" zenbakia hamarrekoetara biribildu.",ans:String(c),opts:shuffle([c,c-10,c+10].map(String))};}
 if(kind==="100"){let n=Math.floor(Math.random()*900)+100;let c=Math.round(n/100)*100;return {cat:"Biribilketa",q:n+" zenbakia ehunekoetara biribildu.",ans:String(c),opts:shuffle([c,Math.max(0,c-100),c+100].map(String))};}
 let n=Math.floor(Math.random()*9000)+1000,c=Math.round(n/1000)*1000;return {cat:"Biribilketa",q:n.toLocaleString("eu-ES")+" zenbakia milakoetara biribildu.",ans:String(c),opts:shuffle([c,Math.max(0,c-1000),c+1000].map(x=>String(x)))}}
function targetQ(d){if(d===2){let t=R([20,30,40,50,60,70,80,90]);let good=t+R([-5,-3,-1,0,2,4]);let bad1=t-6,bad2=t+5;return{cat:"Biribilketa",q:"Zein zenbaki biribiltzen da "+t+"era hamarrekoetara?",ans:String(good),opts:shuffle([good,bad1,bad2].map(String))}}let t=R([100,200,300,400,500,600,700,800,900]);let good=t+R([-49,-25,-1,0,20,49]);return{cat:"Biribilketa",q:"Zein zenbaki biribiltzen da "+t+"era ehunekoetara?",ans:String(good),opts:shuffle([good,t-51,t+50].map(String))}}
const romanMap=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
function toRoman(n){let r="";for(const [v,s] of romanMap){while(n>=v){r+=s;n-=v}}return r}
function romanQ(reverse=false){let n=R([14,18,24,39,45,68,86,92,140,240,375,540,704,900,999]);let r=toRoman(n);return reverse?{cat:"Erromatar zenbakiak",q:r+" zenbat da?",ans:String(n),text:1,roman:1}:{cat:"Erromatar zenbakiak",q:n+" idatzi erromatar zenbakitan.",ans:r,text:1,roman:1}}
const ord=[["5.","bosgarren"],["7.","zazpigarren"],["10.","hamargarren"],["12.","hamabigarren"],["21.","hogeita batgarren"],["25.","hogeita bosgarren"],["34.","hogeita hamalaugarren"],["48.","berrogeita zortzigarren"],["50.","berrogeita hamargarren"],["75.","hirurogeita hamabosgarren"],["80.","laurogeigarren"],["100.","ehungarren"]];
function ordQ(reverse=false){let [n,t]=R(ord);return reverse?{cat:"Ordinalak",q:t+" idatzi zenbakiz.",ans:n,text:1,alts:[n.replace(".","")]}:{cat:"Ordinalak",q:n+" idatzi hitzez.",ans:t,text:1}}
let qs=[roundQ(),roundQ(),roundQ(),targetQ(2),targetQ(3),romanQ(),romanQ(true),romanQ(),romanQ(true),ordQ(),ordQ(true),ordQ(),ordQ(true)],i=0,score=0,lock=0;
function norm(x){return String(x).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ")}
function render(){lock=0;let x=qs[i];document.getElementById("b").style.width=(i/qs.length*100)+"%";document.getElementById("s").textContent=score+" puntu";let h='<span class="tag">'+x.cat+'</span><h1>'+x.q+'</h1><div class="help">Erantzun lasai.</div>';if(x.roman)h+='<div class="roman">Txuleta: I=1 · V=5 · X=10 · L=50 · C=100 · D=500 · M=1000</div>';if(x.text)h+='<input id="in" autocomplete="off" placeholder="Idatzi erantzuna..."><button class="main" onclick="checkText()">Egiaztatu</button>';else h+='<div class="answers">'+x.opts.map(v=>'<button class="a" onclick="check(this,\''+v+'\')">'+v+'</button>').join("")+'</div>';h+='<div class="fb" id="fb"></div><small>Galdera '+(i+1)+' / '+qs.length+'</small>';document.getElementById("q").innerHTML=h}
function right(){score++;let f=document.getElementById("fb");f.className="fb ok";f.textContent="Oso ondo! ✓";document.getElementById("s").textContent=score+" puntu"}
function wrong(a){let f=document.getElementById("fb");f.className="fb bad";f.textContent="Ia! Erantzun zuzena: "+a}
function go(){setTimeout(()=>{i++;i>=qs.length?finish():render()},850)}
function check(btn,v){if(lock)return;lock=1;if(norm(v)===norm(qs[i].ans))right();else wrong(qs[i].ans);go()}
function checkText(){if(lock)return;let v=document.getElementById("in").value;if(!v.trim())return;lock=1;let a=[qs[i].ans,...(qs[i].alts||[])].map(norm);a.includes(norm(v))?right():wrong(qs[i].ans);go()}
function finish(){document.getElementById("b").style.width="100%";let p=Math.round(score/qs.length*100),e=p>=85?"🌟":p>=65?"👏":"💪";document.getElementById("q").innerHTML='<div class="end"><div class="big">'+e+'</div><h1>'+(p>=85?"Primeran!":p>=65?"Oso ondo!":"Segi saiatzen!")+'</h1><p>'+score+' / '+qs.length+' erantzun zuzen</p><button class="main" onclick="location.reload()">Beste ariketa batzuk</button></div>'}
render();</script></body></html>
