name: Temp apply global search patch

on:
  push:
    branches:
      - fix/global-search-closed-sessions
    paths:
      - .github/workflows/temp-global-search-closed-sessions-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-search-closed-sessions
          fetch-depth: 0
      - run: python scripts/temp_global_search_patch.py
      - run: git diff --check
      - name: Commit final patch
        run: |
          rm .github/workflows/temp-global-search-closed-sessions.yml
          rm .github/workflows/temp-global-search-closed-sessions-v2.yml
          rm scripts/temp_global_search_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(search): incluir sesiones y tareas históricas"
          git push origin HEAD:fix/global-search-closed-sessions
