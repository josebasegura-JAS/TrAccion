name: Temporary CI fixture repair

on:
  push:
    branches:
      - fix/restore-ci-tests-20261013

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repair stale test fixtures
        shell: python
        run: |
          from pathlib import Path

          for filename in [
              'src/features/teletrabajo/domain/exportDireccion.test.ts',
              'src/features/teletrabajo/domain/semaforo.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              obsolete = "    nombreApellidos: 'Persona Base',\n    email: '',\n    puestoNomina:"
              if text.count(obsolete) != 1:
                  raise SystemExit(f'{filename}: email obsoleto de solicitud no localizado')
              text = text.replace(obsolete, "    nombreApellidos: 'Persona Base',\n    puestoNomina:", 1)

              marker = "function buildEmployee(overrides: Partial<Employee>): Employee {"
              before, sep, employee = text.partition(marker)
              if not sep:
                  raise SystemExit(f'{filename}: buildEmployee no encontrado')
              employee_name = "    nombreApellidos: 'Persona Base',\n"
              if employee.count(employee_name) < 1:
                  raise SystemExit(f'{filename}: nombre de Employee no encontrado')
              employee = employee.replace(employee_name, employee_name + "    email: '',\n", 1)
              nif_marker = "    nif: '',\n    dni:"
              if employee.count(nif_marker) < 1:
                  raise SystemExit(f'{filename}: NIF de Employee no encontrado')
              employee = employee.replace(nif_marker, "    nif: '',\n    telefono1: '',\n    telefono2: '',\n    dni:", 1)
              path.write_text(before + sep + employee, encoding='utf-8')

          path = Path('src/features/teletrabajo/domain/teletrabajo.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "    validacionJefatura: false,\n    createdAt:"
          if text.count(old) != 1:
              raise SystemExit('teletrabajo.test.ts: validaciones fixture no localizadas')
          text = text.replace(old, "    validacionJefatura: false,\n    validacionDireccion: false,\n    revisado: false,\n    createdAt:", 1)
          old = "    residencia: 'Bilbao',\n    nivelRetributivo: 'N1',"
          if text.count(old) != 1:
              raise SystemExit('teletrabajo.test.ts: Employee fixture no localizado')
          text = text.replace(old, "    residencia: 'Bilbao',\n    unidad: '',\n    nivelRetributivo: 'N1',\n    direccionOrganizativa: '',\n    antiguedadPuesto: '',", 1)
          old = "    nif: '12345678Z',\n    dni:"
          if text.count(old) != 1:
              raise SystemExit('teletrabajo.test.ts: NIF fixture no localizado')
          text = text.replace(old, "    nif: '12345678Z',\n    telefono1: '',\n    telefono2: '',\n    dni:", 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/features/ticket-restaurante/store/useTicketRestauranteStore.concurrency.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "  function buildSqliteRecord(value: unknown, updatedAt: string) {"
          if text.count(old) != 3:
              raise SystemExit(f'Ticket: se esperaban 3 helpers buildSqliteRecord y hay {text.count(old)}')
          new = "  function buildSqliteRecord(value: unknown, updatedAt: string): { id: string; value: string; createdAt: string; updatedAt: string; deletedAt: string | null } {"
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('src/shared/export/coordinacionExcelBackup.test.ts')
          text = path.read_text(encoding='utf-8')
          old = ")) as Parameters<typeof"
          if text.count(old) != 2:
              raise SystemExit(f'Backup: se esperaban 2 casts y hay {text.count(old)}')
          text = text.replace(old, ")) as unknown as Parameters<typeof")
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/temporary-ci-fix.yml').unlink()
          Path('.ci-kick').unlink(missing_ok=True)

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate
        run: |
          npm run typecheck:tests
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit repaired tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align CI fixtures with current types"
          git push origin HEAD:fix/restore-ci-tests-20261013
