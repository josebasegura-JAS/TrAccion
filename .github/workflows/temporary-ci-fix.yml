name: Temporary CI fixture repair

on:
  push:
    branches:
      - fix/restore-ci-tests-20261013

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repair stale test fixtures
        shell: python
        run: |
          from pathlib import Path

          for filename in [
              'src/features/teletrabajo/domain/exportDireccion.test.ts',
              'src/features/teletrabajo/domain/semaforo.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace("    nombreApellidos: 'Persona Base',\n    email: '',\n    puestoNomina:", "    nombreApellidos: 'Persona Base',\n    puestoNomina:", 1)
              marker = "function buildEmployee(overrides: Partial<Employee>): Employee {"
              before, sep, employee = text.partition(marker)
              employee = employee.replace("    nombreApellidos: 'Persona Base',\n", "    nombreApellidos: 'Persona Base',\n    email: '',\n", 1)
              employee = employee.replace("    nif: '',\n    dni:", "    nif: '',\n    telefono1: '',\n    telefono2: '',\n    dni:", 1)
              path.write_text(before + sep + employee, encoding='utf-8')

          path = Path('src/features/teletrabajo/domain/teletrabajo.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    validacionJefatura: false,\n    createdAt:", "    validacionJefatura: false,\n    validacionDireccion: false,\n    revisado: false,\n    createdAt:", 1)
          text = text.replace("    residencia: 'Bilbao',\n    nivelRetributivo: 'N1',", "    residencia: 'Bilbao',\n    unidad: '',\n    nivelRetributivo: 'N1',\n    direccionOrganizativa: '',\n    antiguedadPuesto: '',", 1)
          text = text.replace("    nif: '12345678Z',\n    dni:", "    nif: '12345678Z',\n    telefono1: '',\n    telefono2: '',\n    dni:", 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/features/ticket-restaurante/store/useTicketRestauranteStore.concurrency.test.ts')
          text = path.read_text(encoding='utf-8').replace(
              "  function buildSqliteRecord(value: unknown, updatedAt: string) {",
              "  function buildSqliteRecord(value: unknown, updatedAt: string): { id: string; value: string; createdAt: string; updatedAt: string; deletedAt: string | null } {",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/shared/export/coordinacionExcelBackup.test.ts')
          path.write_text(path.read_text(encoding='utf-8').replace(")) as Parameters<typeof", ")) as unknown as Parameters<typeof"), encoding='utf-8')

          Path('electron/tsconfig.tests.json').write_text('''{
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true,
              "module": "ESNext",
              "moduleResolution": "Bundler"
            },
            "include": ["**/*.ts", "**/*.cts", "**/*.d.ts"],
            "exclude": ["preload.ts"]
          }\n''', encoding='utf-8')

          for path in Path('electron').rglob('*.test.ts'):
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  "safeDatabaseOperation: vi.fn(async (operation: () => unknown) => operation()),",
                  "safeDatabaseOperation: async <T>(operation: () => T) => operation(),",
              )
              text = text.replace("let db: Database.Database;", "let db: InstanceType<typeof Database>;")
              text = text.replace(
                  "status: { ready: true, engine: 'sqlite', phase: 'active' }",
                  "status: { ready: true, engine: 'better-sqlite3' as const, phase: 'active' as const, path: '/x.sqlite', schemaVersion: 17, isDefaultPath: false, lockPath: '/x.lockdir' }",
              )
              text = text.replace(
                  "const createJsonModuleRepository = vi.fn(() => repository);",
                  "const createJsonModuleRepository = vi.fn<(tableName: string, legacyKey: string, moduleLabel: string, getMigrationDone: () => boolean, setMigrationDone: (value: boolean) => void) => typeof repository>(() => repository);",
              )
              for factory in [
                  'createEmployeeRepository', 'createTaskRepository', 'createSorteosRepository',
                  'createSesionesRepository', 'createTeletrabajoRepository',
              ]:
                  text = text.replace(f'{factory}(deps)', f'{factory}(deps as Parameters<typeof {factory}>[0])')
              text = text.replace(
                  'createRecordLockService(dependencies)',
                  'createRecordLockService(dependencies as Parameters<typeof createRecordLockService>[0])',
              )
              text = text.replace(
                  'expect(capturedGetMigrationDone?.()).toBe(false);',
                  'expect((capturedGetMigrationDone as unknown as () => boolean)()).toBe(false);',
              )
              text = text.replace(
                  'capturedSetMigrationDone?.(true);',
                  '(capturedSetMigrationDone as unknown as (value: boolean) => void)(true);',
              )
              text = text.replace(
                  'expect(capturedGetMigrationDone?.()).toBe(true);',
                  'expect((capturedGetMigrationDone as unknown as () => boolean)()).toBe(true);',
              )
              text = text.replace(
                  'setMigrationDoneRef?.(true);',
                  '(setMigrationDoneRef as unknown as (value: boolean) => void)(true);',
              )
              text = text.replace(
                  'expect(getMigrationDoneRef?.()).toBe(true);',
                  'expect((getMigrationDoneRef as unknown as () => boolean)()).toBe(true);',
              )
              text = text.replace(
                  'releaseLockAttempt?.();',
                  '(releaseLockAttempt as unknown as () => void)();',
              )
              path.write_text(text, encoding='utf-8')

          path = Path('electron/persistence/simpleJsonModuleRepository.migration.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('safeDatabaseOperation: safeReads,', "safeDatabaseOperation: safeReads as Parameters<typeof createSimpleJsonModuleRepository>[1]['safeDatabaseOperation'],")
          text = text.replace('safeDatabaseMigrationOperation: safeMigrations,', "safeDatabaseMigrationOperation: safeMigrations as Parameters<typeof createSimpleJsonModuleRepository>[1]['safeDatabaseMigrationOperation'],")
          path.write_text(text, encoding='utf-8')

          path = Path('electron/persistence/localBackupRestoreValidation.test.ts')
          text = path.read_text(encoding='utf-8').replace(
              '      withDatabaseOperationLock,',
              "      withDatabaseOperationLock: withDatabaseOperationLock as LocalBackupServiceDependencies['withDatabaseOperationLock'],",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('electron/persistence/maintenanceQueries.test.ts')
          path.write_text(path.read_text(encoding='utf-8').replace('      const dbPath = db.name;', "      const dbPath = (db as unknown as { name: string }).name;"), encoding='utf-8')

          path = Path('electron/persistence/presupuestosRepository.test.ts')
          text = path.read_text(encoding='utf-8').replace(
              '    expect(deps.createJsonModuleRepository).toHaveBeenCalledTimes(4);\n    const calls = deps.createJsonModuleRepository.mock.calls;',
              "    const createRepositoryMock = deps.createJsonModuleRepository as ReturnType<typeof vi.fn>;\n    expect(createRepositoryMock).toHaveBeenCalledTimes(4);\n    const calls = createRepositoryMock.mock.calls;",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('electron/persistence/persistedRecordsAtomicBatch.test.ts')
          path.write_text(path.read_text(encoding='utf-8').replace("engine: 'better-sqlite3',", "engine: 'better-sqlite3' as const,"), encoding='utf-8')

          path = Path('electron/persistence/sqliteConnection.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('readCurrentSchemaVersion(db)', 'readCurrentSchemaVersion(db!)')
          text = text.replace('readCurrentSchemaVersion(reopened)', 'readCurrentSchemaVersion(reopened!)')
          text = text.replace('db.close()', 'db!.close()').replace('reopened.close()', 'reopened!.close()')
          path.write_text(text, encoding='utf-8')

          path = Path('electron/persistence/taskRepository.test.ts')
          text = path.read_text(encoding='utf-8').replace(
              '  const prepare = vi.fn(() => ({ get, all, run }));',
              '  const prepare = vi.fn((sql: string) => { void sql; return { get, all, run }; });',
          )
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/temporary-ci-fix.yml').unlink()
          Path('.ci-kick').unlink(missing_ok=True)

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate
        run: |
          npm run typecheck:tests
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit repaired tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: restore full CI type safety"
          git push origin HEAD:fix/restore-ci-tests-20261013
