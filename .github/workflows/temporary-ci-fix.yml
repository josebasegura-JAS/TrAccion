name: Temporary CI fixture repair

on:
  push:
    branches:
      - fix/restore-ci-tests-20261013

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repair stale test fixtures
        shell: python
        run: |
          from pathlib import Path

          # Renderer test fixtures that drifted from current domain types.
          for filename in [
              'src/features/teletrabajo/domain/exportDireccion.test.ts',
              'src/features/teletrabajo/domain/semaforo.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace("    nombreApellidos: 'Persona Base',\n    email: '',\n    puestoNomina:", "    nombreApellidos: 'Persona Base',\n    puestoNomina:", 1)
              marker = "function buildEmployee(overrides: Partial<Employee>): Employee {"
              before, sep, employee = text.partition(marker)
              employee = employee.replace("    nombreApellidos: 'Persona Base',\n", "    nombreApellidos: 'Persona Base',\n    email: '',\n", 1)
              employee = employee.replace("    nif: '',\n    dni:", "    nif: '',\n    telefono1: '',\n    telefono2: '',\n    dni:", 1)
              path.write_text(before + sep + employee, encoding='utf-8')

          path = Path('src/features/teletrabajo/domain/teletrabajo.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    validacionJefatura: false,\n    createdAt:", "    validacionJefatura: false,\n    validacionDireccion: false,\n    revisado: false,\n    createdAt:", 1)
          text = text.replace("    residencia: 'Bilbao',\n    nivelRetributivo: 'N1',", "    residencia: 'Bilbao',\n    unidad: '',\n    nivelRetributivo: 'N1',\n    direccionOrganizativa: '',\n    antiguedadPuesto: '',", 1)
          text = text.replace("    nif: '12345678Z',\n    dni:", "    nif: '12345678Z',\n    telefono1: '',\n    telefono2: '',\n    dni:", 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/features/ticket-restaurante/store/useTicketRestauranteStore.concurrency.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "  function buildSqliteRecord(value: unknown, updatedAt: string) {",
              "  function buildSqliteRecord(value: unknown, updatedAt: string): { id: string; value: string; createdAt: string; updatedAt: string; deletedAt: string | null } {",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/shared/export/coordinacionExcelBackup.test.ts')
          text = path.read_text(encoding='utf-8').replace(")) as Parameters<typeof", ")) as unknown as Parameters<typeof")
          path.write_text(text, encoding='utf-8')

          # Electron tests are executed by Vitest/Vite; use Bundler resolution for their
          # test-only typecheck while preserving strict mode inherited from tsconfig.json.
          Path('electron/tsconfig.tests.json').write_text('''{
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true,
              "module": "ESNext",
              "moduleResolution": "Bundler"
            },
            "include": ["**/*.ts", "**/*.cts", "**/*.d.ts"],
            "exclude": ["preload.ts"]
          }\n''', encoding='utf-8')

          # Common stale Electron test mocks: keep strict typing, but make generic
          # infrastructure callbacks genuinely generic instead of vi.fn<unknown>.
          for path in Path('electron').rglob('*.test.ts'):
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  "safeDatabaseOperation: vi.fn(async (operation: () => unknown) => operation()),",
                  "safeDatabaseOperation: async <T>(operation: () => T) => operation(),",
              )
              text = text.replace(
                  "withDatabaseOperationLock: vi.fn(async (_path: string, operation: () => Promise<unknown>) => operation()),",
                  "withDatabaseOperationLock: async <T>(_path: string, operation: () => Promise<T>) => operation(),",
              )
              text = text.replace("let db: Database.Database;", "let db: InstanceType<typeof Database>;")
              text = text.replace(
                  "status: { ready: true, engine: 'sqlite', phase: 'active' }",
                  "status: { ready: true, engine: 'better-sqlite3' as const, phase: 'active' as const, path: '/x.sqlite', schemaVersion: 17, isDefaultPath: false, lockPath: '/x.lockdir' }",
              )
              text = text.replace(
                  "const createJsonModuleRepository = vi.fn(() => repository);",
                  "const createJsonModuleRepository = vi.fn<(tableName: string, legacyKey: string, moduleLabel: string, getMigrationDone: () => boolean, setMigrationDone: (value: boolean) => void) => typeof repository>(() => repository);",
              )
              path.write_text(text, encoding='utf-8')

          path = Path('electron/persistence/persistedRecordsAtomicBatch.test.ts')
          text = path.read_text(encoding='utf-8').replace("engine: 'better-sqlite3',", "engine: 'better-sqlite3' as const,")
          path.write_text(text, encoding='utf-8')

          # Narrowing after expect() is not understood by TypeScript.
          path = Path('electron/persistence/sqliteConnection.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('db.pragma(', 'db!.pragma(').replace('db.close()', 'db!.close()')
          text = text.replace('reopened.pragma(', 'reopened!.pragma(').replace('reopened.close()', 'reopened!.close()')
          path.write_text(text, encoding='utf-8')

          # Temporary workflow and trigger never belong in the final PR tree.
          Path('.github/workflows/temporary-ci-fix.yml').unlink()
          Path('.ci-kick').unlink(missing_ok=True)

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate
        run: |
          npm run typecheck:tests
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit repaired tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: restore full CI type safety"
          git push origin HEAD:fix/restore-ci-tests-20261013
