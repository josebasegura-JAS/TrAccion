name: Temporal - diagnostico ABI SQLite Node
on:
  push:
    branches: [chore/pr5b-electron43-20261112]
permissions:
  contents: read
jobs:
  native-node-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Instalar dependencias
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Diagnóstico inicial SQLite sin detener la ejecución
        shell: pwsh
        run: |
          node -e "try { console.log('native path',require.resolve('better-sqlite3')); const D=require('better-sqlite3'); console.log('loaded');const d=new D(':memory:');console.log('sqlite',d.prepare('select sqlite_version() as v').get());d.close(); } catch(e) { console.error('NODE SQLITE ERROR',e.stack||e); process.exitCode=7 }"
          Write-Host "Codigo de salida de smoke inicial: $LASTEXITCODE"
          exit 0
      - name: Reconstruir exclusivamente para ABI Node
        shell: pwsh
        run: |
          npm rebuild better-sqlite3 --build-from-source --no-audit --no-fund
      - name: Probar SQLite nativo Node después de reconstruir
        shell: pwsh
        run: |
          node -e "const D=require('better-sqlite3');const d=new D(':memory:');console.log('node ABI='+process.versions.modules+' sqlite='+d.prepare('select sqlite_version() as v').get().v);d.close()"
      - name: Ejecutar pruebas aisladas SQLite
        shell: pwsh
        run: |
          npx vitest run electron/persistence/sqliteConnection.test.ts --pool=forks --maxWorkers=1 --minWorkers=1 --no-file-parallelism
      - name: Inspeccionar errores nativos
        if: failure()
        shell: pwsh
        run: |
          Write-Host 'ABI Node y Electron'
          node -p "JSON.stringify(process.versions)"
