name: Temporal - regenerar lock Electron 43
on:
  push:
    branches:
      - chore/pr5b-electron43-20261112
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    # Una única ejecución: el primer commit no contiene el lockfile actualizado.
    if: github.ref == 'refs/heads/chore/pr5b-electron43-20261112' && !contains(github.event.head_commit.message, '[electron43-lock-ready]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolver Electron y regenerar lockfile con npm
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --save-dev electron@43.8.8 @electron/rebuild@4.2.1
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.devDependencies.electron!=='43.8.8'||p.devDependencies['@electron/rebuild']!=='4.2.1'||l.packages['node_modules/electron'].version!=='43.8.8'||l.packages['node_modules/@electron/rebuild'].version!=='4.2.1')process.exit(1)"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Guardar lockfile reproducible en la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "chore: electron 43.8.8 y rebuild 4.2.1 [electron43-lock-ready]"
          git push origin HEAD:chore/pr5b-electron43-20261112
