name: Tests CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    name: TrAccion – Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit && npx tsc -p electron/tsconfig.json --noEmit

      - name: Unit tests
        run: npm run test -- --run --reporter=verbose

      - name: Build renderer
        run: npx vite build
