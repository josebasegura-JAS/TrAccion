name: Tests

on:
  push:
    branches:
      - main
      - develop
      - refactor-ui

  pull_request:
    branches:
      - main
      - develop
      - refactor-ui

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify project files
        shell: cmd
        run: |
          echo Current directory:
          cd
          dir
          if not exist package.json (
            echo ERROR: package.json not found
            exit /b 1
          )

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify installation
        shell: cmd
        run: |
          node --version
          npm --version

          if not exist node_modules (
            echo ERROR: node_modules was not created
            exit /b 1
          )

          if not exist node_modules\.bin\eslint.cmd (
            echo ERROR: eslint was not installed
            dir node_modules\.bin
            exit /b 1
          )

          npx eslint --version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
