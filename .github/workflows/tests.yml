name: Ejecutar tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests manuales
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias completas
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Comprobar herramientas
        run: |
          node --version
          npm --version
          test -x node_modules/.bin/eslint
          npx --no-install eslint --version
          npx --no-install vitest --version
          npx --no-install tsc --version

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests
        run: npm run test

      - name: Compilar app
        run: npm run build
