name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - refactor-ui
      - master
  pull_request:
    branches:
      - main
      - develop
      - refactor-ui
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project root
        run: |
          pwd
          ls -la
          test -f package.json

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev --no-audit --no-fund eslint@9.17.0 @eslint/js@9.17.0 typescript-eslint@8.18.2 eslint-plugin-react-hooks@5.1.0 eslint-plugin-react-refresh@0.4.16 eslint-config-prettier@9.1.0

      - name: Verify ESLint
        run: |
          npm ls eslint @eslint/js typescript-eslint
          npx --no-install eslint --version

      - name: Lint
        run: npx --no-install eslint . --max-warnings=0

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
