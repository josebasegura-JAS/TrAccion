name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - refactor-ui
      - master
  pull_request:
    branches:
      - main
      - develop
      - refactor-ui
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project files
        run: |
          pwd
          ls -la
          test -f package.json

      - name: Install dependencies
        run: |
          npm install --include=dev --no-audit --no-fund

      - name: Verify ESLint
        run: |
          test -f node_modules/eslint/bin/eslint.js
          node node_modules/eslint/bin/eslint.js --version
          npm ls eslint @eslint/js

      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --max-warnings=0

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
