name: Ejecutar tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests manuales
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        shell: bash
        run: |
          unset NPM_CONFIG_PRODUCTION
          unset npm_config_production
          unset NODE_ENV
          npm ci

      - name: Verificar instalación local
        shell: bash
        run: |
          test -x node_modules/.bin/eslint
          test -x node_modules/.bin/vitest
          test -x node_modules/.bin/tsc

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests
        run: npm run test

      - name: Compilar app
        run: npm run build
