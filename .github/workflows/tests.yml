name: Ejecutar tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests manuales
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      npm_config_production: "false"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias completas
        shell: bash
        run: |
          unset NODE_ENV
          unset NPM_CONFIG_PRODUCTION
          unset npm_config_production
          npm ci --production=false
          ./node_modules/.bin/eslint --version

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests
        run: npm run test

      - name: Compilar app
        run: npm run build
