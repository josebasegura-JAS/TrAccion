name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project root
        run: |
          pwd
          ls -la
          test -f package.json

      - name: Install dependencies
        run: |
          npm config set omit ""
          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm install --include=dev
          fi

      - name: Verify local tools
        run: |
          ls -la node_modules/.bin
          test -f node_modules/.bin/eslint
          ./node_modules/.bin/eslint --version
          npm ls eslint @eslint/js

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
