name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - refactor-ui
      - master
  pull_request:
    branches:
      - main
      - develop
      - refactor-ui
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project root
        run: |
          pwd
          ls -la
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Verify installed tools
        run: |
          npm ls eslint @eslint/js eslint-scope typescript-eslint
          node node_modules/eslint/bin/eslint.js --version

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
