name: TrAcción · Batería de tests

# Se dispara en cualquier push/PR y también manualmente.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # 1 · TypeScript + ESLint
  #    Comprueba tipos del renderer Y del main de Electron sin emitir
  #    ningún fichero. ESLint con tolerancia cero a warnings.
  # ════════════════════════════════════════════════════════════════════════
  typecheck-and-lint:
    name: TypeScript & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias (sin scripts nativos)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: tsc renderer — noEmit
        run: ./node_modules/.bin/tsc --noEmit

      - name: tsc electron — noEmit
        run: ./node_modules/.bin/tsc -p electron/tsconfig.json --noEmit

      - name: ESLint (0 warnings tolerados)
        run: npx eslint . --max-warnings=0

  # ════════════════════════════════════════════════════════════════════════
  # 2 · Tests unitarios y de dominio (Vitest + jsdom)
  #    Cubre lógica pura de dominio, stores Zustand, filtros, ordenación,
  #    auditoría, sesiones y exportación. Sin Electron, sin SQLite nativo.
  # ════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit & Domain (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck-and-lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias (sin scripts nativos)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      # Ejecuta todos los *.test.ts/tsx bajo src/ definidos en vitest.config.ts
      - name: Vitest — batería completa con cobertura de tests
        run: npx vitest run --reporter=verbose

  # ════════════════════════════════════════════════════════════════════════
  # 3 · Build renderer + transpilación Electron (sin empaquetar EXE)
  #    Garantiza que el código compila entero antes de cualquier release.
  # ════════════════════════════════════════════════════════════════════════
  build-no-exe:
    name: Build renderer + Electron TS (sin EXE)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Scripts omitidos: Electron y better-sqlite3 compilados no hacen
      # falta para compilar el renderer ni para transpilar el main de Electron.
      - name: Instalar dependencias (sin scripts nativos)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Transpilar Electron main + preload
        run: ./node_modules/.bin/tsc -p electron/tsconfig.json

      - name: Verificar artefactos de build
        run: |
          echo "── dist/ ──────────────────────────────"
          ls -lh dist/
          echo "── dist-electron/ ─────────────────────"
          ls -lh dist-electron/
