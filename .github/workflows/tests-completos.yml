name: TrAcción · Batería de tests

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    name: TypeScript, lint, tests y build sin EXE
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js estable
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Limpiar configuración npm
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set fund false
          npm config set audit false
          npm cache clean --force

      - name: Instalar dependencias
        shell: pwsh
        run: |
          npm install --production=false --include=dev --bin-links=true --no-audit --no-fund

      - name: Diagnóstico de dependencias críticas
        shell: pwsh
        run: |
          npm ls typescript eslint vitest vite --depth=0
          npm exec -- tsc --version
          npm exec -- eslint --version
          npm exec -- vitest --version
          npm exec -- vite --version

      - name: TypeScript renderer
        run: npm exec -- tsc --noEmit

      - name: TypeScript Electron
        run: npm exec -- tsc -p electron/tsconfig.json --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer y Electron sin EXE
        run: npm run build
