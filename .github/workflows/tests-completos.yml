name: TrAcción · Batería de tests

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    name: TypeScript, lint, tests y build sin EXE
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js estable
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Limpiar npm y forzar registry público
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm cache clean --force

      - name: Corregir package-lock con registry público
        shell: pwsh
        run: |
          $lock = "package-lock.json"

          if (!(Test-Path $lock)) {
            throw "No existe package-lock.json"
          }

          $content = Get-Content $lock -Raw
          $content = $content.Replace(
            "https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/",
            "https://registry.npmjs.org/"
          )

          Set-Content $lock $content -NoNewline

      - name: Instalar dependencias limpias desde lockfile
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }

          npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Diagnóstico de dependencias críticas
        shell: pwsh
        run: |
          npm ls typescript eslint vitest vite zustand --depth=0
          npm exec -- tsc --version
          npm exec -- eslint --version
          npm exec -- vitest --version
          npm exec -- vite --version

      - name: TypeScript renderer
        run: npm exec -- tsc --noEmit

      - name: TypeScript Electron
        run: npm exec -- tsc -p electron/tsconfig.json --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer y Electron sin EXE
        run: npm run build
