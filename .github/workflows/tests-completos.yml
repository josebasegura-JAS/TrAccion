name: TrAcción · Batería de tests

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Configurar npm
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false
          npm cache clean --force

      - name: Reparar package-lock
        shell: pwsh
        run: |
          $lock = "package-lock.json"

          if (Test-Path $lock) {
            $content = Get-Content $lock -Raw

            $content = $content.Replace(
              "https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/",
              "https://registry.npmjs.org/"
            )

            Set-Content $lock $content -NoNewline
          }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }

          npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Diagnóstico
        shell: pwsh
        run: |
          node --version
          npm --version

          npm ls typescript eslint vitest vite --depth=0

          npm exec -- tsc --version
          npm exec -- eslint --version
          npm exec -- vitest --version
          npm exec -- vite --version

      - name: TypeScript renderer
        shell: pwsh
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: TypeScript Electron
        shell: pwsh
        run: node node_modules/typescript/bin/tsc -p electron/tsconfig.json --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
