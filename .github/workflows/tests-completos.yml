name: TrAcción · Batería de tests

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configurar npm
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false
          npm cache clean --force

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }

          npm ci --include=dev --no-audit --no-fund
          npm rebuild better-sqlite3

      - name: Diagnóstico
        shell: pwsh
        run: |
          node --version
          npm --version

          npm ls typescript eslint vitest vite --depth=0

          npm exec -- tsc --version
          npm exec -- eslint --version
          npm exec -- vitest --version
          npm exec -- vite --version

      - name: TypeScript renderer
        shell: pwsh
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: TypeScript Electron
        shell: pwsh
        run: node node_modules/typescript/bin/tsc -p electron/tsconfig.json --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
