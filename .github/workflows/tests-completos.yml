name: TrAcción — Validación integral

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validación integral
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate
