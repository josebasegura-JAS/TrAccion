name: TrAcción · Batería de tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  tests:
    name: TypeScript, lint, tests y build sin EXE
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      NPM_CONFIG_INCLUDE: "dev"
      NPM_CONFIG_BIN_LINKS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          npm config get omit
          npm config get include
          npm config get bin-links

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --include=dev --bin-links=true --ignore-scripts --no-audit --no-fund

      - name: Verify local tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tools = @(
            "node_modules\.bin\tsc.cmd",
            "node_modules\.bin\eslint.cmd",
            "node_modules\.bin\vitest.cmd",
            "node_modules\.bin\vite.cmd"
          )

          foreach ($tool in $tools) {
            if (!(Test-Path $tool)) {
              Write-Host "Missing tool: $tool"
              Write-Host "node_modules/.bin contents:"
              Get-ChildItem "node_modules\.bin" | Select-Object -ExpandProperty Name
              throw "Required local CLI tool is missing after npm ci."
            }
          }

      - name: TypeScript renderer
        run: npm exec -- tsc --noEmit

      - name: TypeScript Electron
        run: npm exec -- tsc -p electron/tsconfig.json --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron without EXE
        run: npm run build
