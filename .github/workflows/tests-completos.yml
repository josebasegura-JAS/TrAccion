name: TrAcción — Validación integral

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limpiar_historial_antiguo:
        description: 'Eliminar ejecuciones de workflows retirados (conservar EXE, Lite, ZIP y validación)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validacion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ !inputs.limpiar_historial_antiguo }}
    name: Comprobación / ${{ matrix.lane }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [calidad, vitest, web, electron]
    env:
      CI: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate
        with:
          lane: ${{ matrix.lane }}

  validation:
    name: Validación integral
    if: ${{ always() && !inputs.limpiar_historial_antiguo }}
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir éxito de todas las comprobaciones
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "Resultado de las cuatro comprobaciones: $CHECKS_RESULT"
          test "$CHECKS_RESULT" = "success"

  cleanup_retired:
    name: Limpiar historial de workflows retirados
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.limpiar_historial_antiguo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Eliminar únicamente las ejecuciones de workflows sin fichero actual
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # La API histórica de Actions conserva workflows cuyos .yml ya no
          # existen. Nunca tocar los tres distribuidores ni la validación.
          readonly -a protected_paths=(
            ".github/workflows/build-windows.yml"
            ".github/workflows/build-windows-lite.yml"
            ".github/workflows/build-windows-zip.yml"
            ".github/workflows/tests-completos.yml"
          )

          is_protected() {
            local entry
            for entry in "${protected_paths[@]}"; do
              if [[ "$1" == "$entry" ]]; then return 0; fi
            done
            return 1
          }

          total=0
          removed=0
          while IFS=$'\t' read -r workflow_id workflow_path workflow_state; do
            [[ -n "$workflow_id" ]] || continue
            [[ "$workflow_path" == .github/workflows/* ]] || continue
            if is_protected "$workflow_path"; then
              echo "Conservado: $workflow_path ($workflow_id)"
              continue
            fi
            # Si existe un fichero activo que no está en la lista original,
            # tampoco se borra su historial. Solo limpiar antiguos retirados.
            if [[ -f "$workflow_path" ]]; then
              echo "Conservado (fichero presente): $workflow_path"
              continue
            fi

            echo "::group::Retirado: $workflow_path ($workflow_id)"
            total=$((total + 1))
            # Deshabilitar los workflow retirados que aún figuren activos.
            if [[ "$workflow_state" == "active" ]]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/disable"
            fi
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
              removed=$((removed + 1))
              echo "Eliminada ejecución $run_id"
            done < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100" \
                --jq '.workflow_runs[] | select(.status == "completed") | .id'
            )
            echo "::endgroup::"
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
              --jq '.workflows[] | [.id, .path, .state] | @tsv'
          )
          echo "Workflows retirados revisados: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "Ejecuciones históricas eliminadas: $removed" >> "$GITHUB_STEP_SUMMARY"
