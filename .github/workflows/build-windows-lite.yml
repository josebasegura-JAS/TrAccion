name: Build Windows EXE Lite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-lite:
    name: Build TrAccion portable EXE Lite
    runs-on: windows-latest

    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PYTHON: python
      npm_config_python: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Electron builder binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Configurar registro npm publico
        shell: pwsh
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies from lockfile
        shell: pwsh
        run: |
          npm ci --include=dev --prefer-offline --no-audit --no-fund
          npm rebuild better-sqlite3

      # LITE: no ejecuta typecheck separado, lint ni tests.
      # npm run build ya ejecuta la compilacion TypeScript necesaria para generar la app.
      - name: Build renderer and Electron main
        run: npm run build

      - name: Bump build version
        run: npm run version:bump

      - name: Build portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "electron-builder attempt $attempt of $maxAttempts"
            npx electron-builder --win portable

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "electron-builder failed with exit code $LASTEXITCODE. Retrying after transient download failure..."
              Start-Sleep -Seconds (20 * $attempt)
            }
          }

          exit $LASTEXITCODE

      - name: Create auto-update manifest
        run: npm run update-manifest:write

      - name: Commit updated build counter
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .build-version package.json package-lock.json
          $changes = git status --porcelain

          if ($changes) {
            git commit -m "ci: bump build counter [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host "Sin cambios en el contador de build; nada que commitear."
          }

      - name: Upload EXE and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: TrAccion-V1-windows-portable-lite
          path: |
            release/*.exe
            release/version.json
          if-no-files-found: error
          retention-days: 7
