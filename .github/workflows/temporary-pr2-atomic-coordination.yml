name: Temporary PR2 atomic coordination closure

on:
  push:
    branches:
      - fix/atomic-coordinacion-closure-20261014

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-coordinacion-closure-20261014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply PR2 implementation
        run: python scripts/pr2_apply.py
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate PR2
        run: |
          npm run typecheck:tests
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
          npm run electron:rebuild
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/pr2_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git commit -m "fix: make coordination closure atomic"
          git push origin HEAD:fix/atomic-coordinacion-closure-20261014
