name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build TrAccion V1 portable EXE
    runs-on: windows-latest

    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PYTHON: python
      npm_config_python: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22.13.1-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.13.1-npm-

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Electron builder binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Configurar registro npm público
        shell: pwsh
        run: |
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies from lockfile
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }
          npm ci --include=dev --no-audit --no-fund
          npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron main
        run: npm run build

      - name: Bump build version
        run: npm run version:bump

      - name: Build portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "portable:build attempt $attempt of $maxAttempts"
            npm run portable:build

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "portable:build failed with exit code $LASTEXITCODE. Retrying after transient download failure..."
              Start-Sleep -Seconds (20 * $attempt)
            }
          }

          exit $LASTEXITCODE

      - name: Validate portable EXE
        shell: pwsh
        run: |
          $artifactName = node --input-type=module -e "import { readFileSync } from 'node:fs'; import { getPortableArtifactName } from './scripts/release-version.mjs'; const pkg = JSON.parse(readFileSync('./package.json', 'utf8')); process.stdout.write(getPortableArtifactName(pkg.version));"
          if (-not $artifactName) {
            Write-Error "No se pudo determinar el nombre esperado del portable."
            exit 1
          }
          $exe = Join-Path $PWD ("release\" + $artifactName)
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Error "No se ha generado el portable esperado: $exe"
            Get-ChildItem release -Force | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host "Portable generado: $exe"
          Write-Host "Tamano: $size bytes ($([math]::Round($size / 1MB, 2)) MB)"

          # Un portable Electron real debe ocupar decenas de MB.
          # Impide publicar por error un fichero de unos pocos bytes.
          if ($size -lt 20MB) {
            Write-Error "El EXE generado es anormalmente pequeno ($size bytes). Se cancela la publicacion."
            exit 1
          }

      - name: Create auto-update manifest
        run: npm run update-manifest:write

      - name: Commit updated build counter
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .build-version package.json package-lock.json
          $changes = git status --porcelain

          if ($changes) {
            git commit -m "ci: bump build counter [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host "Sin cambios en el contador de build; nada que commitear."
          }

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: Traccion-windows-portable
          path: |
            release/Traccion *.piz
            release/version.json
          if-no-files-found: error
