name: Build Windows EXE

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      format:
        type: string
        default: portable
      artifact-name:
        type: string
        default: Traccion-windows-portable

permissions:
  contents: write
  actions: read

# Compartido por EXE, Lite y ZIP. Nunca cancelar una distribución en curso.
concurrency:
  group: traccion-distribucion
  cancel-in-progress: false

jobs:
  distribution:
    name: Validar y distribuir el mismo commit
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_ENV: development
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PACKAGE_FORMAT: ${{ inputs.format || 'portable' }}
    steps:
      - name: Exigir main y formato soportado
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Distribuir únicamente desde main.' }
          if ($env:PACKAGE_FORMAT -notin @('portable', 'zip')) { throw 'Formato no soportado.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Exigir validación integral correcta del SHA exacto de main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          $repo = $env:GITHUB_REPOSITORY
          $uri = "https://api.github.com/repos/$repo/actions/workflows/tests-completos.yml/runs?head_sha=$sha&event=push&per_page=30"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $runs = Invoke-RestMethod -Uri $uri -Headers $headers
          $valid = @($runs.workflow_runs | Where-Object { $_.head_sha -eq $sha -and $_.event -eq 'push' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($valid.Count -eq 0) {
            throw "No hay validación integral correcta de main para $sha. Espera al workflow TrAcción — Validación integral (push) y vuelve a ejecutar el generador."
          }
          "Validación heredada del commit: $sha" >> $env:GITHUB_STEP_SUMMARY
      - name: Instalar dependencias para la distribución
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Crear el commit final ANTES de compilar
        shell: pwsh
        run: |
          npm run version:bump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .build-version package.json package-lock.json
          git commit -m 'ci: bump build counter'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
      # Solo cambia el contador y las versiones de los manifiestos.
      # El código fuente ya pasó la validación integral en main.
      - name: Verificar cambios exclusivos de versión
        shell: pwsh
        run: |
          $changed = @(git diff-tree --no-commit-id --name-only -r HEAD)
          $allowed = @('.build-version', 'package.json', 'package-lock.json')
          if (@($changed | Where-Object { $_ -notin $allowed }).Count -gt 0) {
            throw 'El commit de distribución incluye modificaciones ajenas a la versión.'
          }
          $parent = git rev-parse HEAD^
          $old = git show "${parent}:package.json" | ConvertFrom-Json
          $new = Get-Content package.json -Raw | ConvertFrom-Json
          $old.version = $new.version
          if (($old | ConvertTo-Json -Depth 40 -Compress) -ne ($new | ConvertTo-Json -Depth 40 -Compress)) {
            throw 'package.json contiene cambios distintos a version.'
          }
          $oldLock = git show "${parent}:package-lock.json" | ConvertFrom-Json -AsHashtable -Depth 100
          $newLock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable -Depth 100
          $oldLock.version = $newLock.version
          $oldLock['packages']['']['version'] = $newLock['packages']['']['version']
          if (($oldLock | ConvertTo-Json -Depth 100 -Compress) -ne ($newLock | ConvertTo-Json -Depth 100 -Compress)) {
            throw 'package-lock.json contiene cambios distintos a version.'
          }
      - name: Compilar código de producción para Windows
        shell: pwsh
        run: npm run build
      - name: Cache de herramientas de empaquetado
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
      - name: Empaquetar portable o directorio Windows
        shell: pwsh
        run: |
          if ($env:PACKAGE_FORMAT -eq 'zip') {
            npx electron-builder --win --x64 --dir
          } else {
            npm run portable:build
          }
          exit $LASTEXITCODE
      - name: Validar paquete y crear manifiesto o ZIP
        shell: pwsh
        run: |
          if ($env:PACKAGE_FORMAT -eq 'zip') {
            $source = 'release\win-unpacked'
            if (-not (Test-Path "$source\TrAccion.exe")) { throw 'Falta el ejecutable Windows.' }
            $version = node -p "require('./package.json').version"
            $parts = $version.Split('.')
            $zip = "release\TrAccion $($parts[0]).$($parts[1]) Windows.zip"
            Compress-Archive -Path "$source\*" -DestinationPath $zip -CompressionLevel Optimal
          } else {
            $artifactName = node --input-type=module -e "import {readFileSync} from 'node:fs'; import {getPortableArtifactName} from './scripts/release-version.mjs'; console.log(getPortableArtifactName(JSON.parse(readFileSync('package.json','utf8')).version));"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Join-Path 'release' $artifactName
            if (-not (Test-Path -LiteralPath $exe)) { throw 'Falta el portable esperado.' }
            if ((Get-Item -LiteralPath $exe).Length -lt 20MB) { throw 'Portable anormalmente pequeño.' }
            npm run update-manifest:write
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Registrar SHA validado y publicar contador sin rebase
        shell: pwsh
        run: |
          # Ningún archivo rastreado puede cambiar tras la validación.
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content release/validated-commit.txt
          # Si main avanzó, el push falla: nunca empaquetar un árbol y anunciar otro.
          git push origin HEAD:refs/heads/main
          exit $LASTEXITCODE
      - name: Upload paquete validado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'Traccion-windows-portable' }}
          path: |
            release/Traccion *.piz
            release/version.json
            release/TrAccion * Windows.zip
            release/validated-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
