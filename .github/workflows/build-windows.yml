name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-windows.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      format:
        type: string
        default: portable
      artifact-name:
        type: string
        default: Traccion-windows-portable

permissions:
  contents: write

# Compartido por EXE, Lite y ZIP. Nunca cancelar una distribución en curso.
concurrency:
  group: traccion-distribucion
  cancel-in-progress: false

jobs:
  cleanup_retired:
    name: Limpiar historial de workflows retirados
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Borrar ejecuciones completadas de workflows antiguos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t retired < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[] | select(.path != ".github/workflows/build-windows.yml") | .id')
          for id in "${retired[@]}"; do
            mapfile -t runs < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$id/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')
            for run in "${runs[@]}"; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run"
              echo "Eliminada ejecución $run del workflow $id"
            done
          done
          echo "Revisados ${#retired[@]} workflows retirados" >> "$GITHUB_STEP_SUMMARY"

  distribution:
    if: github.event_name != 'push'
    name: Validar y distribuir el mismo commit
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_ENV: development
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PACKAGE_FORMAT: ${{ inputs.format || 'portable' }}
    steps:
      - name: Exigir main y formato soportado
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Distribuir únicamente desde main.' }
          if ($env:PACKAGE_FORMAT -notin @('portable', 'zip')) { throw 'Formato no soportado.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Instalar dependencias para la distribución
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Incrementar versión sin commits en main
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $pkg.version.Split('.')
          $line = "$($parts[0]).$($parts[1])"
          $max = [int](Get-Content .build-version -Raw).Trim()
          git fetch origin "refs/tags/traccion-build/*:refs/tags/traccion-build/*" --no-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tag in @(git tag --list "traccion-build/$line.*")) {
            if ($tag -match '^traccion-build/\d+\.\d+\.(\d+)$') {
              $n = [int]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          $env:TRACCION_BUILD_NUMBER = [string]($max + 1)
          npm run version:bump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Versión de distribución: $line.$env:TRACCION_BUILD_NUMBER" >> $env:GITHUB_STEP_SUMMARY
      - name: Verificar cambios exclusivos de versión
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD)
          $allowed = @('.build-version', 'package.json', 'package-lock.json')
          if (@($changed | Where-Object { $_ -notin $allowed }).Count -gt 0) {
            throw 'La distribución contiene modificaciones ajenas a la versión.'
          }
          $old = git show "HEAD:package.json" | ConvertFrom-Json
          $new = Get-Content package.json -Raw | ConvertFrom-Json
          $old.version = $new.version
          if (($old | ConvertTo-Json -Depth 40 -Compress) -ne ($new | ConvertTo-Json -Depth 40 -Compress)) {
            throw 'package.json contiene cambios distintos a version.'
          }
          $oldLock = git show "HEAD:package-lock.json" | ConvertFrom-Json -AsHashtable -Depth 100
          $newLock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable -Depth 100
          $oldLock.version = $newLock.version
          $oldLock['packages']['']['version'] = $newLock['packages']['']['version']
          if (($oldLock | ConvertTo-Json -Depth 100 -Compress) -ne ($newLock | ConvertTo-Json -Depth 100 -Compress)) {
            throw 'package-lock.json contiene cambios distintos a version.'
          }
          $baseCounter = [int](git show "HEAD:.build-version").Trim()
          $newCounter = [int](Get-Content .build-version -Raw).Trim()
          if ($newCounter -le $baseCounter) { throw 'El contador no ha aumentado.' }
      - name: Compilar código de producción para Windows
        shell: pwsh
        run: npm run build
      - name: Cache de herramientas de empaquetado
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
      - name: Empaquetar portable o directorio Windows
        shell: pwsh
        run: |
          if ($env:PACKAGE_FORMAT -eq 'zip') {
            npx electron-builder --win --x64 --dir
          } else {
            npm run portable:build
          }
          exit $LASTEXITCODE
      - name: Validar paquete y crear manifiesto o ZIP
        shell: pwsh
        run: |
          if ($env:PACKAGE_FORMAT -eq 'zip') {
            $source = 'release\win-unpacked'
            if (-not (Test-Path "$source\TrAccion.exe")) { throw 'Falta el ejecutable Windows.' }
            $version = node -p "require('./package.json').version"
            $parts = $version.Split('.')
            $zip = "release\TrAccion $($parts[0]).$($parts[1]) Windows.zip"
            Compress-Archive -Path "$source\*" -DestinationPath $zip -CompressionLevel Optimal
          } else {
            $artifactName = node --input-type=module -e "import {readFileSync} from 'node:fs'; import {getPortableArtifactName} from './scripts/release-version.mjs'; console.log(getPortableArtifactName(JSON.parse(readFileSync('package.json','utf8')).version));"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Join-Path 'release' $artifactName
            if (-not (Test-Path -LiteralPath $exe)) { throw 'Falta el portable esperado.' }
            if ((Get-Item -LiteralPath $exe).Length -lt 20MB) { throw 'Portable anormalmente pequeño.' }
            npm run update-manifest:write
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Registrar origen y reservar versión con etiqueta Git
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          $version = node -p "require('./package.json').version"
          $tag = "traccion-build/$version"
          $mainRef = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteSha = ($mainRef -split '\s+')[0]
          if ($remoteSha -ne $sha) { throw 'main avanzó durante la distribución: no se publicará una compilación desactualizada.' }
          # Una respuesta 500/commit_refs del servidor puede llegar DESPUÉS
          # de publicar la referencia. Comprobar siempre antes de reintentar.
          function Get-RemoteTagCommit {
            $lines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "No se pudo consultar el tag remoto $tag." }
            if ($lines.Count -eq 0) { return $null }
            $peeled = @($lines | Where-Object { $_.EndsWith('^{}') })
            $selected = if ($peeled.Count -gt 0) { $peeled[0] } else { $lines[0] }
            return (($selected -split '\s+')[0]).Trim()
          }
          function Assert-MainUnchanged {
            $currentMain = git ls-remote origin refs/heads/main
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo verificar main.' }
            if (($currentMain -split '\s+')[0] -ne $sha) {
              throw 'main avanzó durante la distribución. No se publicará un commit antiguo.'
            }
          }
          $existingCommit = Get-RemoteTagCommit
          if ($existingCommit) {
            throw "La versión $version ya está registrada (commit $existingCommit)."
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $sha -m "TrAcción versión distribuida $version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $registered = $false
          foreach ($delay in @(0, 5, 15, 30)) {
            if ($delay -gt 0) { Start-Sleep -Seconds $delay }
            Assert-MainUnchanged
            $remote = Get-RemoteTagCommit
            if ($remote) {
              if ($remote -ne $sha) { throw "Tag $tag asignado a otro commit: $remote." }
              $registered = $true
              break
            }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -eq 0) {
              $registered = $true
              break
            }
            Write-Warning "GitHub rechazó el envío de $tag; se volverá a comprobar si llegó a publicarse."
          }

          if (-not $registered) {
            # Fallback oficial REST para incidencias del transporte Git; mismo
            # GITHUB_TOKEN y mismos permisos de etiqueta, nunca force/update.
            Assert-MainUnchanged
            $remote = Get-RemoteTagCommit
            if (-not $remote) {
              Write-Warning "git push sigue fallando; intento de creación no destructiva mediante GitHub REST."
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha"
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'GitHub REST tampoco ha confirmado la etiqueta.'
              }
            }
          }

          $confirmedCommit = Get-RemoteTagCommit
          if ($confirmedCommit -ne $sha) {
            throw "No se ha registrado la etiqueta $tag apuntando al commit validado ($sha). Resultado remoto: $confirmedCommit."
          }
          "$sha" | Set-Content release/validated-commit.txt
          "Versión registrada: $tag" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload paquete validado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'Traccion-windows-portable' }}
          path: |
            release/Traccion *.piz
            release/version.json
            release/TrAccion * Windows.zip
            release/validated-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
