name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build TrAccion V1 portable EXE
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PYTHON: python
      npm_config_python: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Electron builder binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron main
        run: npm run build

      - name: Build portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "electron-builder attempt $attempt of $maxAttempts"
            npm run electron:build

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "electron-builder failed with exit code $LASTEXITCODE. Retrying after transient download failure..."
              Start-Sleep -Seconds (20 * $attempt)
            }
          }

          exit $LASTEXITCODE

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrAccion-V1-windows-portable
          path: |
            release/*.exe
            release/*portable*.exe
          if-no-files-found: error
