name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build TrAccion V1 portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        env:
          PYTHON: python
          npm_config_python: python
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron main
        run: npm run build

      - name: Build portable EXE
        run: npm run electron:build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrAccion-V1-windows-portable
          path: |
            release/*.exe
            release/*portable*.exe
          if-no-files-found: error
