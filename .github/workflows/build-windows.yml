name: Build Windows EXE

on:
  pull_request:
  workflow_dispatch:
    inputs:
      compression:
        description: Compresión portable (normal para distribución, store para pruebas rápidas; EXE mayor)
        type: choice
        options: [normal, store]
        default: normal
  workflow_call:
    inputs:
      format:
        type: string
        default: portable
      artifact-name:
        type: string
        default: Traccion-windows-portable

permissions:
  contents: read

# Las PR solo se validan; generar EXE nunca reejecuta la batería de tests.
# Los builds manuales siguen en cola sin cancelarse.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('traccion-pr-{0}', github.event.pull_request.number) || 'traccion-distribucion' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name == 'pull_request'
    name: Comprobación / ${{ matrix.lane }}
    runs-on: ${{ matrix.lane == 'electron' && 'windows-2022' || 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [calidad, vitest, web, electron]
    env:
      CI: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate
        with:
          lane: ${{ matrix.lane }}

  validation:
    name: Validación integral
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir éxito de todas las comprobaciones
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "Resultado de las cuatro comprobaciones: $CHECKS_RESULT"
          test "$CHECKS_RESULT" = "success"

  experimental:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/refactor/sqlite-engine-isolation' }}
    name: Generar EXE experimental (sin publicar)
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_ENV: development
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache de herramientas de empaquetado
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
      # Cache exacta, nunca reutilizar dependencias de otro lockfile/Node/runner.
      # Guardar ANTES de electron-builder: la reconstrucción cambia el ABI nativo.
      - name: Restaurar dependencias instaladas
        id: installed-deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: traccion-experimental-deps-v1-windows-2022-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json') }}
      - name: Instalar o verificar dependencias
        id: prepare-deps
        shell: pwsh
        env:
          EXACT_CACHE_HIT: ${{ steps.installed-deps.outputs.cache-hit }}
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $valid = $false
          if ($env:EXACT_CACHE_HIT -eq 'true') {
            if ((Test-Path node_modules/electron/dist/electron.exe) -and
                (Test-Path node_modules/better-sqlite3/build/Release/better_sqlite3.node)) {
              npm ls --depth=0 --include=dev
              $valid = $LASTEXITCODE -eq 0
              if ($valid) {
                node -e "const DB=require('better-sqlite3'); const db=new DB(':memory:'); db.prepare('SELECT 1').get(); db.close()"
                $valid = $LASTEXITCODE -eq 0
              }
            }
          }
          if (-not $valid) {
            npm ci --include=dev --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $timer.Stop()
          "Dependencias: $([math]::Round($timer.Elapsed.TotalSeconds, 2)) s; cache reutilizada: $valid" >> $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Guardar dependencias antes de reconstrucción nativa
        if: steps.installed-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: node_modules
          key: ${{ steps.installed-deps.outputs.cache-primary-key }}
      - name: Compilar aplicación (validación TypeScript y Vite en paralelo)
        shell: pwsh
        run: |
          # Vite no necesita el resultado de tsc: frontend usa noEmit.
          # Mantener ambos typechecks y detener el empaquetado ante cualquier fallo.
          npx --no-install concurrently --kill-others-on-fail --names types,vite "tsc && tsc -p electron/tsconfig.json" "vite build"
          exit $LASTEXITCODE
      - name: Empaquetar portable experimental
        shell: pwsh
        run: |
          New-Item -ItemType File -Path dist-electron/experimental-portable.marker -Force | Out-Null
          npm run portable:build
          exit $LASTEXITCODE
      - name: Comprobar y distinguir el EXE experimental
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File -Filter 'Traccion *.exe')
          if ($files.Count -ne 1 -or $files[0].Length -lt 20MB) { throw 'Portable experimental ausente o inválido.' }
          Rename-Item -LiteralPath $files[0].FullName -NewName 'TrAccion-EXPERIMENTAL-SQLite.exe'
          git rev-parse HEAD | Set-Content release/experimental-commit.txt
      - name: Verificar arranque del ejecutable empaquetado
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("traccion-smoke-" + [guid]::NewGuid())
          $env:TRACCION_PACKAGED_SMOKE_PROFILE = Join-Path $root 'profile'
          $profile = Join-Path $root 'profile-entorno-pruebas'
          $database = Join-Path $root 'database'
          New-Item -ItemType Directory -Path $profile, $database -Force | Out-Null
          $preferences = Join-Path $profile 'sqlite-preferences.json'
          @{ customDirectoryPath = $database; dailyLocalBackupEnabled = $false } |
            ConvertTo-Json | Set-Content -LiteralPath $preferences -Encoding utf8NoBOM
          $report = Join-Path $profile 'last-startup-performance.json'
          $exe = (Resolve-Path 'release/TrAccion-EXPERIMENTAL-SQLite.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path -LiteralPath $report) {
                try {
                  $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
                  $bound = Get-Content -LiteralPath $preferences -Raw | ConvertFrom-Json
                  $uuid = [guid]::Empty
                  $databaseReady = (Test-Path -LiteralPath (Join-Path $database 'traccion.sqlite')) -and [guid]::TryParse([string]$bound.expectedDatabaseUuid, [ref]$uuid) -and ($uuid -ne [guid]::Empty) -and ($bound.customDirectoryPath -eq $database)
                  $rendererReady = @($data.steps | Where-Object { $_.label -eq 'React preparado' }).Count -gt 0
                  $visible = @($data.steps | Where-Object { $_.label -like 'Dashboard visible*' }).Count -gt 0
                  $errors = @($data.steps | Where-Object { $_.label -like 'Fallo renderer:*' -or $_.label -eq 'Fallo de inicialización SQLite' })
                  if ($databaseReady -and $data.environment -eq 'test' -and $data.engine -eq 'isolated' -and $rendererReady -and $visible -and $errors.Count -eq 0) {
                    $ready = $true
                    break
                  }
                } catch { }
              }
            }
            if (-not $ready) {
              if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
              Write-Host ('SQLite temporal creada: ' + (Test-Path -LiteralPath (Join-Path $database 'traccion.sqlite')))
              throw 'El EXE empaquetado no confirmó interfaz visible, base temporal vinculada y arranque sin errores.'
            }
            Get-Content -LiteralPath $report
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }
          exit 0
      - name: Conservar diagnóstico del arranque experimental
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrAccion-diagnostico-arranque
          path: ${{ runner.temp }}/traccion-smoke-*/profile-entorno-pruebas/last-startup-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Descargar únicamente el EXE de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: TrAccion-EXPERIMENTAL-SQLite
          path: |
            release/TrAccion-EXPERIMENTAL-SQLite.exe
            release/experimental-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  distribution:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    name: Generar EXE sin repetir tests
    # Electron 43 + better-sqlite3: utilizar la imagen con toolchain C++
    # verificada por las pruebas de escritorio (matrix.lane == electron).
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_ENV: development
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PACKAGE_FORMAT: ${{ inputs.format || 'portable' }}
      TRACCION_PORTABLE_COMPRESSION: ${{ inputs.compression || 'normal' }}
    steps:
      - name: Exigir main y formato soportado
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Distribuir únicamente desde main.' }
          if ($env:PACKAGE_FORMAT -notin @('portable', 'zip')) { throw 'Formato no soportado.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # electron-builder usa node-gyp interno que aún requiere distutils.
      # Fijar Python 3.11, ya probado en lane Electron, y no usar el Python
      # predeterminado del runner (puede ser 3.12+).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Restaurar antes de npm ci y antes del incremento de versión.
      - name: Cache de herramientas de empaquetado
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-v2-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependencias para la distribución
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          npm ci --include=dev --prefer-offline --no-audit --no-fund
          $code = $LASTEXITCODE
          $timer.Stop()
          "Dependencias: $([math]::Round($timer.Elapsed.TotalSeconds, 2)) s" >> $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Verificar Visual Studio C++ antes de empaquetar
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'No se encuentra vswhere: falta Visual Studio Installer en el runner Windows.' }
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw 'Faltan herramientas C++ x64 de Visual Studio necesarias para reconstruir better-sqlite3.'
          }
          Write-Host "Visual Studio C++ disponible: $vsInstall"
      - name: Incrementar versión sin commits en main
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $pkg.version.Split('.')
          $line = "$($parts[0]).$($parts[1])"
          $max = [int](Get-Content .build-version -Raw).Trim()
          git fetch origin "refs/tags/traccion-build/*:refs/tags/traccion-build/*" --no-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tag in @(git tag --list "traccion-build/$line.*")) {
            if ($tag -match '^traccion-build/\d+\.\d+\.(\d+)$') {
              $n = [int]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          $env:TRACCION_BUILD_NUMBER = [string]($max + 1)
          npm run version:bump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Versión de distribución: $line.$env:TRACCION_BUILD_NUMBER" >> $env:GITHUB_STEP_SUMMARY
      - name: Verificar cambios exclusivos de versión
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD)
          $allowed = @('.build-version', 'package.json', 'package-lock.json')
          if (@($changed | Where-Object { $_ -notin $allowed }).Count -gt 0) {
            throw 'La distribución contiene modificaciones ajenas a la versión.'
          }
          $old = git show "HEAD:package.json" | ConvertFrom-Json
          $new = Get-Content package.json -Raw | ConvertFrom-Json
          $old.version = $new.version
          if (($old | ConvertTo-Json -Depth 40 -Compress) -ne ($new | ConvertTo-Json -Depth 40 -Compress)) {
            throw 'package.json contiene cambios distintos a version.'
          }
          $oldLock = git show "HEAD:package-lock.json" | ConvertFrom-Json -AsHashtable -Depth 100
          $newLock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable -Depth 100
          $oldLock.version = $newLock.version
          $oldLock['packages']['']['version'] = $newLock['packages']['']['version']
          if (($oldLock | ConvertTo-Json -Depth 100 -Compress) -ne ($newLock | ConvertTo-Json -Depth 100 -Compress)) {
            throw 'package-lock.json contiene cambios distintos a version.'
          }
          $baseCounter = [int](git show "HEAD:.build-version").Trim()
          $newCounter = [int](Get-Content .build-version -Raw).Trim()
          if ($newCounter -le $baseCounter) { throw 'El contador no ha aumentado.' }
      - name: Compilar código de producción para Windows
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          npm run build
          $code = $LASTEXITCODE
          $timer.Stop()
          "Compilación: $([math]::Round($timer.Elapsed.TotalSeconds, 2)) s" >> $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Empaquetar portable o directorio Windows
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          if ($env:PACKAGE_FORMAT -eq 'zip') {
            npx electron-builder --win --x64 --dir
          } else {
            npm run portable:build
          }
          $code = $LASTEXITCODE
          $timer.Stop()
          "Empaquetado ($env:PACKAGE_FORMAT, $env:TRACCION_PORTABLE_COMPRESSION): $([math]::Round($timer.Elapsed.TotalSeconds, 2)) s" >> $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Validar paquete y crear manifiesto o ZIP
        shell: pwsh
        run: |
          if ($env:PACKAGE_FORMAT -eq 'zip') {
            $source = 'release\win-unpacked'
            if (-not (Test-Path "$source\TrAccion.exe")) { throw 'Falta el ejecutable Windows.' }
            $version = node -p "require('./package.json').version"
            $parts = $version.Split('.')
            $zip = "release\TrAccion $($parts[0]).$($parts[1]) Windows.zip"
            Compress-Archive -Path "$source\*" -DestinationPath $zip -CompressionLevel Optimal
          } else {
            $artifactName = node --input-type=module -e "import {readFileSync} from 'node:fs'; import {getPortableArtifactName} from './scripts/release-version.mjs'; console.log(getPortableArtifactName(JSON.parse(readFileSync('package.json','utf8')).version));"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Join-Path 'release' $artifactName
            if (-not (Test-Path -LiteralPath $exe)) { throw 'Falta el portable esperado.' }
            $exeBytes = (Get-Item -LiteralPath $exe).Length
            "Tamaño EXE: $([math]::Round($exeBytes / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
            if ($exeBytes -lt 20MB) { throw 'Portable anormalmente pequeño.' }
            npm run update-manifest:write
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Registrar origen y reservar versión con etiqueta Git
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          $version = node -p "require('./package.json').version"
          $tag = "traccion-build/$version"
          $mainRef = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteSha = ($mainRef -split '\s+')[0]
          if ($remoteSha -ne $sha) { throw 'main avanzó durante la distribución: no se publicará una compilación desactualizada.' }
          # Una respuesta 500/commit_refs del servidor puede llegar DESPUÉS
          # de publicar la referencia. Comprobar siempre antes de reintentar.
          function Get-RemoteTagCommit {
            $lines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "No se pudo consultar el tag remoto $tag." }
            if ($lines.Count -eq 0) { return $null }
            $peeled = @($lines | Where-Object { $_.EndsWith('^{}') })
            $selected = if ($peeled.Count -gt 0) { $peeled[0] } else { $lines[0] }
            return (($selected -split '\s+')[0]).Trim()
          }
          function Assert-MainUnchanged {
            $currentMain = git ls-remote origin refs/heads/main
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo verificar main.' }
            if (($currentMain -split '\s+')[0] -ne $sha) {
              throw 'main avanzó durante la distribución. No se publicará un commit antiguo.'
            }
          }
          $existingCommit = Get-RemoteTagCommit
          if ($existingCommit) {
            throw "La versión $version ya está registrada (commit $existingCommit)."
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $sha -m "TrAcción versión distribuida $version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $registered = $false
          foreach ($delay in @(0, 5, 15, 30)) {
            if ($delay -gt 0) { Start-Sleep -Seconds $delay }
            Assert-MainUnchanged
            $remote = Get-RemoteTagCommit
            if ($remote) {
              if ($remote -ne $sha) { throw "Tag $tag asignado a otro commit: $remote." }
              $registered = $true
              break
            }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -eq 0) {
              $registered = $true
              break
            }
            Write-Warning "GitHub rechazó el envío de $tag; se volverá a comprobar si llegó a publicarse."
          }

          if (-not $registered) {
            # Fallback oficial REST para incidencias del transporte Git; mismo
            # GITHUB_TOKEN y mismos permisos de etiqueta, nunca force/update.
            Assert-MainUnchanged
            $remote = Get-RemoteTagCommit
            if (-not $remote) {
              Write-Warning "git push sigue fallando; intento de creación no destructiva mediante GitHub REST."
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha"
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'GitHub REST tampoco ha confirmado la etiqueta.'
              }
            }
          }

          $confirmedCommit = Get-RemoteTagCommit
          if ($confirmedCommit -ne $sha) {
            throw "No se ha registrado la etiqueta $tag apuntando al commit validado ($sha). Resultado remoto: $confirmedCommit."
          }
          "$sha" | Set-Content release/validated-commit.txt
          "Versión registrada: $tag" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload paquete validado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'Traccion-windows-portable' }}
          path: |
            release/Traccion *.piz
            release/version.json
            release/TrAccion * Windows.zip
            release/validated-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
