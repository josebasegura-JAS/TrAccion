name: Temp fix close tracking

on:
  push:
    branches:
      - fix/task-close-keeps-tracking

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-close-keeps-tracking
      - name: Aplicar corrección
        shell: pwsh
        run: |
          $path = 'src/components/task-editor/useTaskEditorController.ts'
          $content = Get-Content $path -Raw
          $old = 'updateTask(task.id, closedDraft, undefined, loadedUpdatedAt)'
          $new = 'updateTask(task.id, closedDraft, seguimientoForSave, loadedUpdatedAt)'
          if (-not $content.Contains($old)) { throw 'No se encontró la llamada esperada de cierre de tarea.' }
          $content = $content.Replace($old, $new)
          Set-Content -Path $path -Value $content -NoNewline -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-fix-close-tracking.yml
          git add $path
          git commit -m 'fix(tareas): conservar seguimiento al cerrar tarea'
          git push origin HEAD:fix/task-close-keeps-tracking
