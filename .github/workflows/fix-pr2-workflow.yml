name: Repair PR2 temporary workflow

on:
  push:
    branches:
      - fix/atomic-coordinacion-closure-20261014

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-coordinacion-closure-20261014
          fetch-depth: 0
      - name: Repair workflow shell
        shell: pwsh
        run: |
          $path = '.github/workflows/temporary-pr2-atomic-coordination.yml'
          $content = Get-Content $path -Raw
          $content = $content.Replace('shell: python', 'shell: python {0}')
          Set-Content -Path $path -Value $content -Encoding utf8
          Remove-Item '.github/workflows/fix-pr2-workflow.yml'
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair PR2 validation runner"
          git push origin HEAD:fix/atomic-coordinacion-closure-20261014
