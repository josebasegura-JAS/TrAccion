name: Tests CI

on:
  workflow_dispatch:

jobs:
  tests:
    name: Run tests manually
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Prepare npm
        shell: pwsh
        run: |
          npm --version
          node --version
          npm config set fund false
          npm config set audit false
          npm config set cache "$env:RUNNER_TEMP\npm-cache"
          npm cache clean --force

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "npm install attempt $i"
            npm install --no-audit --no-fund --legacy-peer-deps

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            npm cache clean --force
            Start-Sleep -Seconds 10
          }

          exit 1

      - name: Run lint
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm run test --if-present

      - name: Run UI tests
        run: npm run test:ui --if-present

      - name: Run Electron tests
        run: npm run test:electron --if-present

      - name: Build check without EXE
        run: npm run build
