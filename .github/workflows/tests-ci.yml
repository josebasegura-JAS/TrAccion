name: Tests CI

on:
  workflow_dispatch:

jobs:
  tests:
    name: Run tests manually
    runs-on: windows-latest

    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Show environment
        shell: pwsh
        run: |
          node --version
          npm --version
          npm config get production
          npm config get omit

      - name: Clean previous install state
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item -Recurse -Force node_modules
          }
          npm cache clean --force

      - name: Install all dependencies including devDependencies
        shell: pwsh
        run: |
          npm install --include=dev --no-audit --no-fund --legacy-peer-deps

      - name: Verify local tools
        shell: pwsh
        run: |
          if (!(Test-Path ".\node_modules\.bin\eslint.cmd")) {
            Write-Error "eslint.cmd not found. devDependencies were not installed."
            exit 1
          }

          if (!(Test-Path ".\node_modules\.bin\vitest.cmd")) {
            Write-Error "vitest.cmd not found. devDependencies were not installed."
            exit 1
          }

          .\node_modules\.bin\eslint.cmd --version
          .\node_modules\.bin\vitest.cmd --version

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run UI tests
        run: npm run test:ui --if-present

      - name: Build check without EXE
        run: npm run build
