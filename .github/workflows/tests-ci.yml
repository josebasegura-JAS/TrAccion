name: Tests CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Tests only
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure clean npm cache
        shell: pwsh
        run: |
          npm config set cache "$env:RUNNER_TEMP\npm-cache" --global
          npm config set fund false --global
          npm config set audit false --global

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: UI critical tests
        run: npm run test:ui --if-present

      - name: Build verification without EXE
        run: npm run build
