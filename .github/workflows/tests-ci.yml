name: Tests CI

on:
  workflow_dispatch:

jobs:
  tests:
    name: Lint, unit tests, and build without EXE
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Show toolchain and npm install mode
        shell: pwsh
        run: |
          node --version
          npm --version
          npm config get production
          npm config get omit

      - name: Install dependencies from lockfile
        shell: pwsh
        run: |
          # Use a clean, lockfile-based install on every run so the job never
          # depends on a previously restored node_modules cache. Scripts are
          # skipped intentionally: this workflow only needs TypeScript/Vite,
          # ESLint, and Vitest, while native/Electron postinstall steps can be
          # flaky on Windows and are not required to build without packaging.
          npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Verify local CLI tools before lint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $eslint = Join-Path $PWD "node_modules\.bin\eslint.cmd"
          $vitest = Join-Path $PWD "node_modules\.bin\vitest.cmd"

          if (!(Test-Path $eslint)) {
            Write-Host "node_modules/.bin contents:"
            if (Test-Path "node_modules\.bin") {
              Get-ChildItem "node_modules\.bin" | Select-Object -ExpandProperty Name
            } else {
              Write-Host "node_modules/.bin directory is missing"
            }
            npm ls eslint --depth=0
            throw "eslint.cmd not found after npm ci. devDependencies were not installed or npm bin links were not created."
          }

          if (!(Test-Path $vitest)) {
            Write-Host "node_modules/.bin contents:"
            if (Test-Path "node_modules\.bin") {
              Get-ChildItem "node_modules\.bin" | Select-Object -ExpandProperty Name
            } else {
              Write-Host "node_modules/.bin directory is missing"
            }
            npm ls vitest --depth=0
            throw "vitest.cmd not found after npm ci. devDependencies were not installed or npm bin links were not created."
          }

          & $eslint --version
          & $vitest --version

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron TypeScript without EXE
        run: npm run build

      # UI/Electron tests are intentionally not run in this workflow. They use
      # Playwright/Electron runtime dependencies and should live in a separate
      # opt-in workflow if needed, so this manual CI remains a stable lint/unit/
      # build check and never invokes electron-builder or creates an EXE.
