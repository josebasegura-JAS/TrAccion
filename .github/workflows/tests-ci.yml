name: Tests CI

on:
  workflow_dispatch:

jobs:
  tests:
    name: Lint, unit tests, and build without EXE
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      NPM_CONFIG_INCLUDE: "dev"
      NPM_CONFIG_BIN_LINKS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Show toolchain and npm install mode
        shell: pwsh
        run: |
          node --version
          npm --version
          npm config get omit
          npm config get include
          npm config get bin-links

      - name: Configurar registro npm público
        shell: pwsh
        run: |
          npm config set registry https://registry.npmjs.org/

      - name: Reparar package-lock con registry público
        shell: pwsh
        run: |
          $lock = "package-lock.json"

          if (!(Test-Path $lock)) {
            throw "No existe package-lock.json"
          }

          $content = Get-Content $lock -Raw

          $content = $content.Replace(
            "https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/",
            "https://registry.npmjs.org/"
          )

          Set-Content $lock $content -NoNewline

      - name: Install dependencies from lockfile
        shell: pwsh
        run: |
          npm ci --include=dev --bin-links=true --no-audit --no-fund

      - name: Verify local CLI tools before lint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $eslint = Join-Path $PWD "node_modules\.bin\eslint.cmd"
          $vitest = Join-Path $PWD "node_modules\.bin\vitest.cmd"

          if (!(Test-Path $eslint)) {
            Write-Host "node_modules/.bin contents:"
            if (Test-Path "node_modules\.bin") {
              Get-ChildItem "node_modules\.bin" | Select-Object -ExpandProperty Name
            } else {
              Write-Host "node_modules/.bin directory is missing"
            }
            npm ls eslint --depth=0
            throw "eslint.cmd not found after npm ci. devDependencies were not installed or npm bin links were not created."
          }

          if (!(Test-Path $vitest)) {
            Write-Host "node_modules/.bin contents:"
            if (Test-Path "node_modules\.bin") {
              Get-ChildItem "node_modules\.bin" | Select-Object -ExpandProperty Name
            } else {
              Write-Host "node_modules/.bin directory is missing"
            }
            npm ls vitest --depth=0
            throw "vitest.cmd not found after npm ci. devDependencies were not installed or npm bin links were not created."
          }

          & $eslint --version
          & $vitest --version

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron TypeScript without EXE
        run: npm run build
