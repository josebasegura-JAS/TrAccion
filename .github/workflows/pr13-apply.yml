name: PR13 focused patch
on:
  push:
    branches: [fix/recovery-await-store-hydration]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-await-store-hydration
      - name: Apply patch
        run: python scripts/pr13_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: await store hydration after reconnect"
          git push origin HEAD:fix/recovery-await-store-hydration
