name: Temporary PR5 atomic historical import

on:
  push:
    branches:
      - fix/atomic-session-history-import-20261014

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    env:
      CI: "true"
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply PR5 implementation
        shell: pwsh
        run: |
          python scripts/pr5_apply.py
          python scripts/pr5_fix.py
      - name: Install dependencies
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false
          npm ci --include=dev --no-audit --no-fund
          npm rebuild better-sqlite3
      - name: TypeScript tests
        run: npm run typecheck:tests
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Rebuild native Electron dependencies
        run: npm run electron:rebuild
      - name: Smoke Electron critical
        run: npx playwright test -c playwright.electron.config.ts e2e/electron/app-ui-smoke.spec.ts e2e/electron/critical-flows.spec.ts
      - name: Commit PR5 code
        shell: pwsh
        run: |
          Remove-Item scripts/pr5_apply.py -ErrorAction SilentlyContinue
          Remove-Item scripts/pr5_fix.py -ErrorAction SilentlyContinue
          Remove-Item playwright-report-electron -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item test-results -Recurse -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          if (git diff --cached --quiet) { Write-Host 'No app changes to commit'; exit 0 }
          git commit -m "fix: import committee and paritaria history atomically"
          git push origin HEAD:fix/atomic-session-history-import-20261014
