name: TEMP · Fase 2B Ticket storage

on:
  push:
    branches:
      - refactor/fase-2b-ticket-storage-final

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-2b-ticket-storage-final
          fetch-depth: 0

      - name: Aplicar extracción mecánica de codecs
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/ticket-restaurante/store/useTicketRestauranteStore.ts')
          text = path.read_text(encoding='utf-8')

          text = text.replace('  normalizeTicketIsoWeekdays,\n', '')
          text = text.replace('  splitTicketPersonFullName,\n', '')
          text = text.replace('  type TicketRestauranteSqliteRecord,\n', '')

          marker = "} from './ticketRestauranteSqliteRepository';\n"
          storage_import = """import {
            isTicketCalendar,
            isTicketManutencion,
            isTicketPerson,
            isTicketRestaurantAbsence,
            normalizeStoredTicketCalendar,
            normalizeStoredTicketManutencion,
            normalizeStoredTicketPerson,
            parseTicketAbsenceRecords,
            parseTicketCalendarRecords,
            parseTicketManutencionRecords,
            parseTicketPersonRecords,
          } from './ticketRestauranteStorage';
          """
          storage_import = '\n'.join(line[10:] if line.startswith('          ') else line for line in storage_import.splitlines()) + '\n'
          if storage_import not in text:
              text = text.replace(marker, marker + storage_import, 1)

          def remove_between(source: str, start: str, end: str) -> str:
              start_index = source.index(start)
              end_index = source.index(end, start_index)
              return source[:start_index] + source[end_index:]

          text = remove_between(text, 'function isTicketCalendar(', 'function readJsonArray')
          text = remove_between(text, 'function normalizeStoredTicketCalendar(', 'function readConfig')
          text = remove_between(text, 'function parseTicketCalendarRecords(', 'function parseTicketPersonRecords(')
          text = remove_between(text, 'function parseTicketPersonRecords(', 'function parseTicketAbsenceRecords(')
          text = remove_between(text, 'function parseTicketAbsenceRecords(', 'function updateManutencionSqliteUpdatedAtMap(')
          text = remove_between(text, 'function parseTicketManutencionRecords(', '/**\n * Carga calendarios')

          forbidden = [
              'function isTicketCalendar(',
              'function isTicketPerson(',
              'function isTicketRestaurantAbsence(',
              'function isTicketManutencion(',
              'function normalizeStoredTicketCalendar(',
              'function normalizeStoredTicketPerson(',
              'function normalizeStoredTicketManutencion(',
              'function parseTicketCalendarRecords(',
              'function parseTicketPersonRecords(',
              'function parseTicketAbsenceRecords(',
              'function parseTicketManutencionRecords(',
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'Quedan implementaciones duplicadas: {remaining}')
          if "from './ticketRestauranteStorage';" not in text:
              raise SystemExit('No se añadió el import de ticketRestauranteStorage')

          path.write_text(text, encoding='utf-8')

      - name: Verificar diff acotado
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/features/ticket-restaurante/store/useTicketRestauranteStore.ts"
          grep -q "from './ticketRestauranteStorage';" src/features/ticket-restaurante/store/useTicketRestauranteStore.ts
          ! grep -q "function isTicketCalendar(" src/features/ticket-restaurante/store/useTicketRestauranteStore.ts
          ! grep -q "function parseTicketCalendarRecords(" src/features/ticket-restaurante/store/useTicketRestauranteStore.ts

      - name: Commit del refactor y retirada del workflow temporal
        shell: bash
        run: |
          rm .github/workflows/temp-fase2b-ticket-storage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ticket-restaurante): usar codecs de almacenamiento"
          git push origin HEAD:refactor/fase-2b-ticket-storage-final
