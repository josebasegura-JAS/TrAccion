name: PR15 apply readonly migrations

on:
  push:
    branches:
      - fix/sqlite-readonly-migrations

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Aplicar cambios
        shell: pwsh
        run: python .github/scripts/pr15_run_fixed.py
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests PR15
        run: npx vitest run electron/sqliteIpcQueue.test.ts electron/persistence/simpleJsonModuleRepository.migration.test.ts electron/persistence/simpleDomainRepositoryFactory.test.ts --fileParallelism=false
      - name: Commit final
        shell: pwsh
        run: |
          Remove-Item .github/scripts/pr15_apply.py
          Remove-Item .github/scripts/pr15_run_fixed.py
          Remove-Item .github/workflows/pr15-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sqlite): separar migraciones de lecturas concurrentes"
          git push
