name: Temporal - compatibilidad better-sqlite3 Electron 43
on:
  push:
    branches:
      - chore/pr5b-electron43-20261112

permissions:
  contents: write

jobs:
  update-native:
    if: "!contains(github.event.head_commit.message, '[native-lock-ready]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Actualizar SQLite nativo y resolver dependencias
        run: |
          npm view better-sqlite3 version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact better-sqlite3@latest
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.dependencies['better-sqlite3']!==l.packages['node_modules/better-sqlite3'].version)process.exit(1);if(l.packages['node_modules/electron'].version!=='43.8.8')process.exit(1)"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Guardar manifiesto y lockfile resueltos por npm
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "fix: actualizar better-sqlite3 para Electron 43 [native-lock-ready]"
          git push origin HEAD:chore/pr5b-electron43-20261112
