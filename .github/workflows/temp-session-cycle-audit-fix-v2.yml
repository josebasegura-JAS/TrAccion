name: Temp apply session cycle audit fix

on:
  push:
    branches:
      - fix/session-cycle-global-search
    paths:
      - .github/workflows/temp-session-cycle-audit-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-cycle-global-search
          fetch-depth: 0
      - name: Apply patch
        run: python .github/temp-session-cycle-patch.py
      - name: Verify diff
        run: git diff --check
      - name: Commit final files
        shell: bash
        run: |
          rm .github/temp-session-cycle-patch.py
          rm .github/workflows/temp-session-cycle-audit-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/globalSearch.ts src/services/globalSearch.test.ts src/shared/sessions/SessionManagementPage.tsx src/shared/sessions/sessionManagementPage.helpers.ts src/shared/sessions/sessionManagementPage.helpers.test.ts .github/temp-session-cycle-patch.py .github/workflows/temp-session-cycle-audit-fix-v2.yml
          git commit -m "fix(sessions): conservar puntos históricos y búsqueda por módulo"
          git push origin HEAD:fix/session-cycle-global-search