name: UI Tests

on:
  workflow_dispatch:

jobs:
  ui-tests:
    name: Playwright Electron UI tests without EXE
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js estable
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Setup Python for native dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar npm y forzar registry público
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm cache clean --force

      - name: Reparar package-lock con registry público
        shell: pwsh
        run: |
          $lock = "package-lock.json"

          if (!(Test-Path $lock)) {
            throw "No existe package-lock.json"
          }

          $content = Get-Content $lock -Raw

          $content = $content.Replace(
            "https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/",
            "https://registry.npmjs.org/"
          )

          Set-Content $lock $content -NoNewline

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }

          npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Diagnóstico
        shell: pwsh
        run: |
          node --version
          npm --version
          npm ls typescript eslint vitest vite playwright electron --depth=0
          npm exec -- playwright --version
          npm exec -- electron --version
          npm exec -- tsc --version

      - name: Compile Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Run UI tests
        run: npm run test:e2e:electron

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-electron-ui-report
          path: |
            playwright-report-electron
            test-results
          if-no-files-found: ignore
