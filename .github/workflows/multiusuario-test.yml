name: Multiusuario Tests

on:
  workflow_dispatch:

jobs:
  multiusuario-tests:
    name: Multiusuario tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run multiusuario tests
        run: npx vitest run src/shared/multiusuario/multiusuario.test.ts --fileParallelism=false
