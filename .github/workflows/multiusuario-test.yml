name: Multiusuario Tests

on:
  workflow_dispatch:

jobs:
  multiusuario-tests:
    name: Multiusuario Tests
    runs-on: windows-latest

    env:
      CI: "true"
      NODE_ENV: development
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      NPM_CONFIG_INCLUDE: "dev"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Configurar npm
        shell: pwsh
        run: |
          npm config delete production
          npm config delete omit
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false
          npm cache clean --force

      - name: Reparar package-lock
        shell: pwsh
        run: |
          $lock = "package-lock.json"
          if (!(Test-Path $lock)) {
            throw "No existe package-lock.json"
          }

          $content = Get-Content $lock -Raw
          $content = $content.Replace(
            "https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/",
            "https://registry.npmjs.org/"
          )
          Set-Content $lock $content -NoNewline

      - name: Instalar dependencias
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }

          npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Diagnostico
        shell: pwsh
        run: |
          node --version
          npm --version
          npm ls vitest vite @vitejs/plugin-react --depth=0

      - name: Ejecutar externalDataSync
        shell: pwsh
        run: |
          node node_modules/vitest/vitest.mjs run src/services/externalDataSync.multiuser.test.ts --fileParallelism=false

      - name: Ejecutar multiusuario
        shell: pwsh
        run: |
          node node_modules/vitest/vitest.mjs run src/shared/multiusuario/multiusuario.test.ts --fileParallelism=false

      - name: Ejecutar tests de concurrencia de stores
        shell: pwsh
        run: |
          node node_modules/vitest/vitest.mjs run `
            src/features/sorteos/store/useSorteosStore.concurrency.test.ts `
            src/features/especiales/store/useEspecialesStore.concurrency.test.ts `
            src/features/vinculograma/store/useVinculogramaStore.concurrency.test.ts `
            src/features/configuracion/store/useConfiguracionStore.concurrency.test.ts `
            src/features/presupuestos/store/usePresupuestosStore.concurrency.test.ts `
            src/features/ticket-restaurante/store/useTicketRestauranteStore.concurrency.test.ts `
            src/features/criterios-rrll/store/useCriteriosRrllStore.concurrency.test.ts `
            src/features/plantilla/store/useEmployeeStore.concurrency.test.ts `
            --fileParallelism=false
