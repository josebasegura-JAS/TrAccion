name: Multiusuario Tests

on:
  workflow_dispatch:

jobs:
  multiusuario-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Vitest
        run: npm ls vitest

      - name: Run multiusuario tests
        run: npm run test -- src/shared/multiusuario/multiusuario.test.ts --fileParallelism=false
