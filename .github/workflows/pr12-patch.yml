name: PR12 focused patch
on:
  push:
    branches: [fix/ticket-people-import-atomic]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticket-people-import-atomic
      - name: Apply focused integration patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'electron/preload.cts',
              "  removeTicketRestauranteCalendarWithPeopleAtomically: (payload: {\n    calendar: { id: string; value: string; expectedUpdatedAt: string | null };\n    people: Array<{ id: string; value: string; expectedUpdatedAt: string | null }>;\n  }) => ipcRenderer.invoke('ticket-restaurante-calendars:remove-with-people-atomically', payload),\n",
              "  removeTicketRestauranteCalendarWithPeopleAtomically: (payload: {\n    calendar: { id: string; value: string; expectedUpdatedAt: string | null };\n    people: Array<{ id: string; value: string; expectedUpdatedAt: string | null }>;\n  }) => ipcRenderer.invoke('ticket-restaurante-calendars:remove-with-people-atomically', payload),\n  importTicketRestaurantePeopleAtomically: (payload: {\n    calendars: Array<{ id: string; value: string; expectedUpdatedAt: string | null }>;\n    people: Array<{ id: string; value: string; expectedUpdatedAt: string | null }>;\n  }) => ipcRenderer.invoke('ticket-restaurante-people:import-atomically', payload),\n",
          )

          replace_once(
              'electron/ipc/registerTicketRestauranteIpc.ts',
              "import {\n  removeTicketRestauranteCalendarWithPeopleAtomically,\n} from '../persistence/ticketRestauranteAtomicCalendarRemoval.js';\n",
              "import {\n  removeTicketRestauranteCalendarWithPeopleAtomically,\n} from '../persistence/ticketRestauranteAtomicCalendarRemoval.js';\nimport {\n  importTicketRestaurantePeopleAtomically,\n} from '../persistence/ticketRestauranteAtomicPeopleImport.js';\n",
          )

          marker = "  ipcMain.handle('ticket-restaurante-people:load-records', () =>\n"
          handler = """  ipcMain.handle('ticket-restaurante-people:import-atomically', (_event, payload: unknown) => {\n    if (!payload || typeof payload !== 'object') {\n      return {\n        ok: false,\n        status: getSqliteStatus(),\n        message: 'Payload de importación atómica de Ticket Restaurante inválido.',\n      };\n    }\n\n    const candidate = payload as { calendars?: unknown; people?: unknown };\n    const calendars = validateConditionalJsonRecordBatch(\n      { records: candidate.calendars },\n      'Payload de calendarios de importación de Ticket Restaurante inválido.',\n    );\n    if (!calendars.ok) {\n      return { ok: false, status: calendars.result.status, message: calendars.result.message };\n    }\n    const people = validateConditionalJsonRecordBatch(\n      { records: candidate.people },\n      'Payload de personas de importación de Ticket Restaurante inválido.',\n    );\n    if (!people.ok) {\n      return { ok: false, status: people.result.status, message: people.result.message };\n    }\n\n    return enqueueSqliteIpc('ticket-restaurante-people:import-atomically', () =>\n      importTicketRestaurantePeopleAtomically(getSqliteStatus(), {\n        calendars: calendars.records,\n        people: people.records,\n      }),\n    );\n  });\n"""
          replace_once('electron/ipc/registerTicketRestauranteIpc.ts', marker, handler + marker)

          replace_once(
              'src/features/ticket-restaurante/store/useTicketRestauranteStore.ts',
              "  saveTicketRestauranteCalendarsToSqlite,\n  saveTicketRestauranteCalendarToSqlite,\n  saveTicketRestaurantePeopleToSqlite,\n  saveTicketRestaurantePersonToSqlite,\n",
              "  saveTicketRestauranteCalendarToSqlite,\n  saveTicketRestaurantePersonToSqlite,\n",
          )
          replace_once(
              'src/features/ticket-restaurante/store/useTicketRestauranteStore.ts',
              "import {\n  hasAtomicTicketCalendarRemoval,\n  removeTicketCalendarWithPeopleAtomically,\n} from './ticketRestauranteAtomicRemoval';\n",
              "import {\n  hasAtomicTicketCalendarRemoval,\n  removeTicketCalendarWithPeopleAtomically,\n} from './ticketRestauranteAtomicRemoval';\nimport {\n  hasAtomicTicketPeopleImport,\n  importTicketPeopleAtomically,\n} from './ticketRestauranteAtomicImport';\n",
          )

          old_block = """    if (\n      hasTicketRestauranteCalendarsSqliteRepository() &&\n      hasTicketRestaurantePeopleSqliteRepository()\n    ) {\n      if (newCalendars.length > 0) {\n        const calendarsSaveResult = await saveTicketRestauranteCalendarsToSqlite(\n          newCalendars.map((calendar) => ({\n            id: calendar.id,\n            serializedValue: JSON.stringify(calendar),\n            expectedUpdatedAt: null,\n          })),\n        );\n        if (!calendarsSaveResult?.ok) {\n          return {\n            ...result,\n            ok: false,\n            message:\n              calendarsSaveResult?.message ??\n              'No se han podido crear los calendarios nuevos en SQLite.',\n          };\n        }\n      }\n\n      if (updatedPeople.length > 0) {\n        const peopleSaveResult = await saveTicketRestaurantePeopleToSqlite(\n          updatedPeople.map((person) => ({\n            id: person.empleado,\n            serializedValue: JSON.stringify(person),\n            expectedUpdatedAt: personSqliteUpdatedAt.get(person.empleado) ?? null,\n          })),\n        );\n        if (!peopleSaveResult?.ok) {\n          return {\n            ...result,\n            ok: false,\n            message:\n              peopleSaveResult?.message ?? 'No se han podido importar las personas en SQLite.',\n          };\n        }\n      }\n\n      updateCalendarSqliteUpdatedAtMap(calendars);\n      updatePersonSqliteUpdatedAtMap(people);\n      set({ calendars, people });\n      return { ...result, ok: true };\n    }\n"""
          new_block = """    if (\n      hasTicketRestauranteCalendarsSqliteRepository() &&\n      hasTicketRestaurantePeopleSqliteRepository()\n    ) {\n      if (!hasAtomicTicketPeopleImport()) {\n        return {\n          ...result,\n          ok: false,\n          message:\n            'La importación atómica de Ticket Restaurante no está disponible. Recarga o reinicia TrAcción antes de continuar.',\n        };\n      }\n\n      const importResult = await importTicketPeopleAtomically(\n        newCalendars.map((calendar) => ({\n          id: calendar.id,\n          serializedValue: JSON.stringify(calendar),\n          expectedUpdatedAt: null,\n        })),\n        updatedPeople.map((person) => ({\n          id: person.empleado,\n          serializedValue: JSON.stringify(person),\n          expectedUpdatedAt: personSqliteUpdatedAt.get(person.empleado) ?? null,\n        })),\n      );\n      if (!importResult?.ok) {\n        return {\n          ...result,\n          ok: false,\n          message:\n            importResult?.message ?? 'No se han podido importar las personas en SQLite de forma atómica.',\n        };\n      }\n\n      updateCalendarSqliteUpdatedAtMap(calendars);\n      updatePersonSqliteUpdatedAtMap(people);\n      set({ calendars, people });\n      return { ...result, ok: true };\n    }\n"""
          replace_once('src/features/ticket-restaurante/store/useTicketRestauranteStore.ts', old_block, new_block)

          Path('.github/workflows/pr12-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/preload.cts electron/ipc/registerTicketRestauranteIpc.ts src/features/ticket-restaurante/store/useTicketRestauranteStore.ts .github/workflows/pr12-patch.yml
          git commit -m "feat: wire atomic Ticket Restaurante people import"
          git push origin HEAD:fix/ticket-people-import-atomic
