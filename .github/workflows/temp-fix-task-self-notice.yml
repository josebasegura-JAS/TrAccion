name: Temp fix task self notice
on:
  push:
    branches: [fix/task-created-self-notice]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-created-self-notice
      - name: Aplicar ajuste
        shell: python
        run: |
          from pathlib import Path

          domain = Path('src/features/tareas/domain/taskCreationNotifications.ts')
          text = domain.read_text(encoding='utf-8')
          old = """export function markTaskCreationsSeen(windowsUser: string, tasks: readonly Task[]): void {\n  const state = readState(windowsUser);\n  if (!state) return;\n  writeState(windowsUser, {\n    ...state,\n    seenTaskIds: [...state.seenTaskIds, ...tasks.map((task) => task.id)],\n  });\n}\n"""
          new = """export function markTaskCreationIdsSeen(windowsUser: string, taskIds: readonly string[]): void {\n  const state = readState(windowsUser);\n  if (!state) return;\n  writeState(windowsUser, {\n    ...state,\n    seenTaskIds: [...state.seenTaskIds, ...taskIds.filter(Boolean)],\n  });\n}\n\nexport function markTaskCreationsSeen(windowsUser: string, tasks: readonly Task[]): void {\n  markTaskCreationIdsSeen(windowsUser, tasks.map((task) => task.id));\n}\n"""
          if old not in text:
              raise SystemExit('No se encontró bloque markTaskCreationsSeen')
          domain.write_text(text.replace(old, new), encoding='utf-8')

          controller = Path('src/components/task-editor/useTaskEditorController.ts')
          text = controller.read_text(encoding='utf-8')
          anchor = "import { formatImportedTaskMail } from '../../features/tareas/domain/taskMail';\n"
          repl = anchor + "import { markTaskCreationIdsSeen } from '../../features/tareas/domain/taskCreationNotifications';\n"
          if anchor not in text:
              raise SystemExit('No se encontró import taskMail')
          text = text.replace(anchor, repl, 1)
          old2 = """      if (result.recordId) {\n        const coordinationResult = await updateCoordinationTargets(result.recordId);\n"""
          new2 = """      if (result.recordId) {\n        // La tarea recién creada no debe aparecer como \"nueva\" al propio creador.\n        // El visto es local por usuario, por lo que el resto del equipo sí recibirá el aviso azul.\n        markTaskCreationIdsSeen(trackingUser, [result.recordId]);\n        const coordinationResult = await updateCoordinationTargets(result.recordId);\n"""
          if old2 not in text:
              raise SystemExit('No se encontró bloque de creación')
          controller.write_text(text.replace(old2, new2, 1), encoding='utf-8')

          test = Path('src/features/tareas/domain/taskCreationNotifications.test.ts')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              "  markTaskCreationsSeen,\n",
              "  markTaskCreationIdsSeen,\n  markTaskCreationsSeen,\n",
              1,
          )
          needle = """  it('mantiene el visto separado por usuario', () => {\n"""
          addition = """  it('permite marcar como vista una tarea recién creada solo por su ID', () => {\n    initializeTaskCreationNoticeBaseline('Joseba', '2026-10-06T18:00:00.000Z');\n    const created = task('own-task', '2026-10-06T18:01:00.000Z');\n    markTaskCreationIdsSeen('Joseba', ['own-task']);\n    expect(getUnseenTaskCreations([created], 'Joseba')).toEqual([]);\n  });\n\n"""
          if needle not in text:
              raise SystemExit('No se encontró punto de inserción en test')
          test.write_text(text.replace(needle, addition + needle, 1), encoding='utf-8')
      - name: Commit limpio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/task-editor/useTaskEditorController.ts src/features/tareas/domain/taskCreationNotifications.ts src/features/tareas/domain/taskCreationNotifications.test.ts
          git rm .github/workflows/temp-fix-task-self-notice.yml
          git commit -m "fix(tareas): no avisar al creador de su propia tarea"
          git push origin HEAD:fix/task-created-self-notice
