name: TrAcción — Validación integral
description: Validación por grupos paralelos; cada grupo conserva sus pruebas completas.
inputs:
  lane:
    description: Grupo de pruebas (calidad, vitest, web, electron)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@v5
      if: ${{ inputs.lane == 'electron' }}
      with:
        python-version: '3.11'
    - name: Dependencias desde lockfile
      shell: pwsh
      run: npm ci --include=dev --no-audit --no-fund
    - name: TypeScript de pruebas, Electron y E2E
      if: ${{ inputs.lane == 'calidad' }}
      shell: pwsh
      run: npm run typecheck:tests
    - name: ESLint sin advertencias
      if: ${{ inputs.lane == 'calidad' }}
      shell: pwsh
      run: npm run lint
    - name: TypeScript de aplicación/Electron y build de producción
      if: ${{ inputs.lane == 'calidad' }}
      shell: pwsh
      run: npm run build
    - name: Vitest completo, SQLite, multiusuario y cobertura (medido)
      if: ${{ inputs.lane == 'vitest' }}
      shell: pwsh
      run: |
        $timer = [System.Diagnostics.Stopwatch]::StartNew()
        npm run test:coverage
        $testExitCode = $LASTEXITCODE
        $timer.Stop()
        New-Item -ItemType Directory -Force -Path audit-results | Out-Null
        $duration = [math]::Round($timer.Elapsed.TotalSeconds, 2).ToString([System.Globalization.CultureInfo]::InvariantCulture)
        Set-Content -Path audit-results/vitest-elapsed-seconds.txt -Value $duration
        node scripts/report-vitest-timing.mjs
        $reportExitCode = $LASTEXITCODE
        if ($testExitCode -ne 0) { exit $testExitCode }
        if ($reportExitCode -ne 0) { exit $reportExitCode }
    - name: Instalar Chromium de Playwright
      if: ${{ inputs.lane == 'web' }}
      shell: pwsh
      run: npx playwright install chromium
    - name: Interfaz web
      if: ${{ inputs.lane == 'web' }}
      shell: pwsh
      run: npm run test:e2e
    - name: Compilar Electron para las pruebas de escritorio
      if: ${{ inputs.lane == 'electron' }}
      shell: pwsh
      run: npm run build
    # La reconstrucción nativa cambia better-sqlite3 de ABI Node a ABI Electron.
    # Electron corre en un job aislado: nunca compromete las pruebas Vitest.
    - name: Preparar ABI Electron
      if: ${{ inputs.lane == 'electron' }}
      shell: pwsh
      run: npm run electron:rebuild
    - name: Todos los tests Electron, incluido Ticket y dos usuarios
      if: ${{ inputs.lane == 'electron' }}
      shell: pwsh
      run: npm run test:e2e:electron
    - name: Resumen de comprobación
      if: ${{ always() }}
      shell: pwsh
      env:
        LANE: ${{ inputs.lane }}
      run: |
        $sha = git rev-parse HEAD
        "## TrAcción — $env:LANE`nCommit: $sha`n" >> $env:GITHUB_STEP_SUMMARY
    - name: Conservar resultados y trazas
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: calidad-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          coverage
          audit-results
          playwright-report-web
          playwright-report-electron
          test-results
        if-no-files-found: warn
        retention-days: 14
