name: TrAcción — Validación integral
description: Validación por grupos paralelos; cada grupo conserva sus pruebas completas.
inputs:
  lane:
    description: Grupo de pruebas (calidad, vitest, web, electron)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      if: ${{ inputs.lane != 'vitest' }}
      with:
        node-version-file: .nvmrc
        cache: npm
    # better-sqlite3 13.1.1 provoca un acceso inválido nativo bajo Node 22.13.1
    # en Windows; Node 24 supera la prueba de apertura SQLite y sus tests.
    - uses: actions/setup-node@v4
      if: ${{ inputs.lane == 'vitest' }}
      with:
        node-version: '24'
        cache: npm
    - name: Comprobar ABI SQLite nativo antes de Vitest
      if: ${{ inputs.lane == 'vitest' }}
      shell: pwsh
      run: |
        node -e "const Sqlite=require('better-sqlite3');const db=new Sqlite(':memory:');console.log('SQLite disponible en Node '+process.version+': '+db.prepare('select sqlite_version() as version').get().version);db.close()"
    - uses: actions/setup-python@v5
      if: ${{ inputs.lane == 'electron' }}
      with:
        python-version: '3.11'
    - name: Dependencias desde lockfile (reintentos ante fallo de descarga)
      shell: pwsh
      run: |
        # npm ci es determinista con package-lock. Reintentar solo si falla
        # por un error de red transitorio (por ejemplo, el 504 de Electron).
        $maxAttempts = 3
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          $log = Join-Path $env:RUNNER_TEMP "traccion-npm-ci-attempt-$attempt.log"
          Write-Host "npm ci: intento $attempt de $maxAttempts"
          & npm ci --include=dev --no-audit --no-fund *>&1 |
            ForEach-Object { "$_" | Tee-Object -FilePath $log -Append }
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            Write-Host "Dependencias instaladas correctamente."
            break
          }
          $output = Get-Content -Path $log -Raw
          $transient = $output -match '(?i)(HTTPError: Response code (429|500|502|503|504)|\b(ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENOTFOUND)\b|Gateway Time-out)'
          if (-not $transient -or $attempt -eq $maxAttempts) {
            Write-Error "npm ci falló con código $exitCode. Error no recuperable o máximo de intentos alcanzado."
            exit $exitCode
          }
          # El origen de GitHub para binarios de Electron ha devuelto 504
          # repetidamente. Electron documenta ELECTRON_MIRROR como alternativa.
          # Solo cambiar el origen del binario al fallar la descarga normal.
          if ($output -match '(?i)(node_modules[\\/]electron|electron.*install\.js|electron.*download|HTTPError: Response code 504)') {
            $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
            Write-Warning "Descarga de Electron no disponible; se usará el mirror documentado para el siguiente intento."
          }
          $delaySeconds = 15 * $attempt
          Write-Warning "Descarga transitoria fallida; nuevo intento en $delaySeconds segundos."
          Start-Sleep -Seconds $delaySeconds
        }
    - name: TypeScript de pruebas, Electron y E2E
      if: ${{ inputs.lane == 'calidad' }}
      shell: pwsh
      run: npm run typecheck:tests
    - name: ESLint sin advertencias
      if: ${{ inputs.lane == 'calidad' }}
      shell: pwsh
      run: npm run lint
    - name: TypeScript de aplicación/Electron y build de producción
      if: ${{ inputs.lane == 'calidad' }}
      shell: pwsh
      run: npm run build
    - name: Vitest completo, SQLite, multiusuario y cobertura (medido)
      if: ${{ inputs.lane == 'vitest' }}
      shell: pwsh
      run: |
        $timer = [System.Diagnostics.Stopwatch]::StartNew()
        npm run test:coverage
        $testExitCode = $LASTEXITCODE
        $timer.Stop()
        New-Item -ItemType Directory -Force -Path audit-results | Out-Null
        $duration = [math]::Round($timer.Elapsed.TotalSeconds, 2).ToString([System.Globalization.CultureInfo]::InvariantCulture)
        Set-Content -Path audit-results/vitest-elapsed-seconds.txt -Value $duration
        node scripts/report-vitest-timing.mjs
        $reportExitCode = $LASTEXITCODE
        if ($testExitCode -ne 0) { exit $testExitCode }
        if ($reportExitCode -ne 0) { exit $reportExitCode }
    - name: Instalar Chromium de Playwright
      if: ${{ inputs.lane == 'web' }}
      shell: pwsh
      run: npx playwright install chromium
    - name: Interfaz web
      if: ${{ inputs.lane == 'web' }}
      shell: pwsh
      run: npm run test:e2e
    - name: Compilar Electron para las pruebas de escritorio
      if: ${{ inputs.lane == 'electron' }}
      shell: pwsh
      run: npm run build
    # La reconstrucción nativa cambia better-sqlite3 de ABI Node a ABI Electron.
    # Electron corre en un job aislado: nunca compromete las pruebas Vitest.
    - name: Preparar ABI Electron
      if: ${{ inputs.lane == 'electron' }}
      shell: pwsh
      run: npm run electron:rebuild
    - name: Todos los tests Electron, incluido Ticket y dos usuarios
      if: ${{ inputs.lane == 'electron' }}
      shell: pwsh
      run: npm run test:e2e:electron
    - name: Resumen de comprobación
      if: ${{ always() }}
      shell: pwsh
      env:
        LANE: ${{ inputs.lane }}
      run: |
        $sha = git rev-parse HEAD
        "## TrAcción — $env:LANE`nCommit: $sha`n" >> $env:GITHUB_STEP_SUMMARY
    - name: Conservar resultados y trazas
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: calidad-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          coverage
          audit-results
          playwright-report-web
          playwright-report-electron
          test-results
        if-no-files-found: warn
        retention-days: 14
